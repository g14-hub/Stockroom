<!doctype html>
<html lang="en" id="htm"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stockroom</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1d1d1b;--mut:#6b6a63;--line:#d6d4cb;--acc:#1f6f5c;--red:#c0392b;--amb:#c77d00;--redbg:#f7d9d5;--ambbg:#fbe9c6;--ok:#e6efe9}
@media(prefers-color-scheme:dark){:root{--bg:#161614;--card:#222220;--ink:#eeede6;--mut:#a3a199;--line:#3d3c37;--acc:#4fb597;--red:#e5705f;--amb:#e8a933;--redbg:#4a2420;--ambbg:#4a3612;--ok:#1f2e28}}
*{box-sizing:border-box}
body{margin:0;font:15px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button,select,input{font:inherit;color:inherit}
button{background:var(--inp);border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-height:40px;cursor:pointer}
button.on,button.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
button.danger{border-color:var(--red);color:var(--red)}
button:disabled{opacity:.4;cursor:default}
input,select{background:var(--inp);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-height:36px;max-width:100%}
input.bad{border-color:var(--red);background:var(--redbg)}
label{display:inline-flex;flex-direction:column;gap:2px;margin:4px 10px 4px 0;font-size:13px;color:var(--mut)}
label.inl{flex-direction:row;align-items:center;gap:6px}
label input,label select{color:var(--ink)}
h2{margin:12px 0 6px;font-size:17px}h3{margin:6px 0;font-size:15px}
.mut,small{color:var(--mut)}
nav{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 12px;background:var(--card);border-bottom:1px solid var(--line)}
nav .brand{font-weight:700;border:0;background:none;font-size:17px;padding:4px 6px}
nav .navr{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.dot{display:inline-block;min-width:22px;text-align:center;border-radius:11px;padding:1px 6px;font-size:12px;font-weight:700;color:#fff;background:var(--mut)}
.dot.st1{background:var(--amb)}.dot.st2{background:var(--red)}
.clock{padding:10px 14px 0;color:var(--mut);font-size:14px}
.warn{background:var(--ambbg);padding:8px 14px;font-size:13px}
.msg{background:var(--ambbg);border-left:6px solid var(--amb);margin:8px 12px 0;padding:8px 12px;border-radius:8px}
.done{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--acc);color:#fff;padding:8px 14px}
.done label{color:#fff}.done button{background:#fff;color:var(--acc)}
.crumbs{padding:6px 14px;font-size:14px}.crumbs button{border:0;background:none;padding:4px;min-height:32px;color:var(--acc);text-decoration:underline}
.grid{display:grid;gap:12px;padding:8px 12px 40px}
@media(min-width:900px){.grid{grid-template-columns:minmax(0,1.5fr) minmax(340px,1fr);align-items:start}.panel{max-height:82vh;overflow:auto;position:sticky;top:60px}}
.cvbox,.panel,.mapwrap,.notifs{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
.mapwrap,.notifs{margin:10px 12px}
#cv,#map{display:block;width:100%;height:auto;max-height:64vh;user-select:none;touch-action:none}
.floor{fill:var(--card);stroke:var(--ink);stroke-width:2px;vector-effect:non-scaling-stroke}
.gl{stroke:var(--line);stroke-width:1px;vector-effect:non-scaling-stroke}
.node>rect,.room rect{fill:var(--ok);stroke:var(--mut);stroke-width:2px;vector-effect:non-scaling-stroke;cursor:pointer}
.node.st1>rect,.room.st1 rect{fill:var(--ambbg);stroke:var(--amb)}
.node.st2>rect,.room.st2 rect{fill:var(--redbg);stroke:var(--red)}
.node.sel>rect{stroke:var(--acc);stroke-width:5px}
.node.lift>rect{stroke:var(--acc);stroke-width:5px;stroke-dasharray:8 4}
.node text,.room text{pointer-events:none;fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.node text.tl{text-anchor:start}.node text.bd{text-anchor:end}.st1>.bd{fill:var(--amb)}.st2>.bd{fill:var(--red)}
.node .h{fill:var(--acc);stroke:var(--card);stroke-width:2px;vector-effect:non-scaling-stroke;cursor:nwse-resize}
@keyframes fl{0%,100%{opacity:1}50%{opacity:.3}}.flash>rect{animation:fl .6s 3}
svg.dot0{display:inline-block;width:14px;height:14px;vertical-align:middle;margin-right:2px}
.n{display:flex;gap:10px;align-items:center;border-left:6px solid var(--mut);border-radius:8px;padding:8px 10px;margin:6px 0;cursor:pointer;background:var(--bg)}
.n.st1{border-color:var(--amb);background:var(--ambbg)}.n.st2{border-color:var(--red);background:var(--redbg)}
.n .ic{font-size:20px}.n.st1 .ic{color:var(--amb)}.n.st2 .ic{color:var(--red)}.n .nt{flex:1}
.chip{margin:2px 4px 2px 0;padding:4px 10px;min-height:32px;border-radius:16px}
.tree{margin-top:8px}.tr{margin:2px 0}.th{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.tr.sel>.th{background:var(--ok);border-radius:8px}
.arr{border:0;background:none;width:32px;min-height:32px;padding:0;font-size:16px}.arr0{display:inline-block;width:32px}
.nm{border:0;background:none;text-align:left;padding:4px 2px;min-height:32px;font-weight:600}
.pops{white-space:nowrap}.gl2{font-weight:700}.gl2.st1{color:var(--amb)}.gl2.st2{color:var(--red)}
.tb{margin-left:14px;border-left:2px solid var(--line);padding-left:8px}
.card{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:8px 0;background:var(--bg)}
.grp{border-top:1px solid var(--line);padding:6px 0}.rec{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:4px 0}
.rec .rt{flex:1 1 180px}
.chk{background:var(--ambbg);border-left:6px solid var(--amb);border-radius:8px;padding:6px 10px;margin:6px 0}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.ef{display:flex;flex-wrap:wrap}.ef input{width:100px}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--dlg);color:var(--ink);width:min(96vw,860px);padding:0}
dialog::backdrop{background:rgba(0,0,0,.45)}
.mb{padding:16px;max-height:88vh;overflow:auto}
.tw{overflow-x:auto}table{border-collapse:collapse}th,td{padding:4px 6px;text-align:left;vertical-align:top;font-size:13px}th{color:var(--mut);font-weight:600;white-space:nowrap}
.cap{font-size:11px;color:var(--mut);min-height:14px}.pre button{padding:0 6px;min-height:24px;font-size:11px;margin-right:2px}
.err{color:var(--red);font-size:13px;margin-top:8px}
details{border:1px solid var(--line);border-radius:10px;margin:8px 0;background:var(--card)}
summary{cursor:pointer;padding:10px 12px;font-weight:600}.sb{padding:0 12px 12px}
.pr{display:flex;align-items:center;gap:6px;padding:3px 0;flex-wrap:wrap}.pr>span{flex:1 1 140px}
:root{--wvbg:#eaf2ef}
@media(prefers-color-scheme:dark){:root{--wvbg:#1b2a25}}
.tiles{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.tile{border:1px solid var(--line);border-radius:10px;padding:4px 10px;text-align:center;background:var(--bg);display:flex;flex-direction:column;min-width:64px}
.tile b{font-size:17px}.tile.st1{background:var(--ambbg)}.tile.st2{background:var(--redbg)}
.srow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:6px 8px;border-radius:8px;cursor:pointer}
.srow:hover{background:var(--ok)}.srow.sel{background:var(--ok);outline:2px solid var(--acc)}
.cl{font-size:11px;border:1px solid var(--line);border-radius:10px;padding:0 6px;color:var(--mut)}
.vbar{display:flex;gap:6px;padding:4px 14px;flex-wrap:wrap;align-items:center}
.cvwrap{position:relative;transform-origin:center}
.cvbox.wvmode{background:var(--wvbg);border:3px solid var(--acc)}
.pill{position:absolute;top:6px;right:6px;z-index:2;background:var(--acc);color:#fff;border-radius:14px;padding:3px 12px;font-size:13px;font-weight:600;pointer-events:none;max-width:90%}
.mini{position:absolute;left:6px;bottom:6px;width:84px;z-index:2;background:var(--card);border:1px solid var(--line);border-radius:6px;pointer-events:none;opacity:.95}
.mini text{text-anchor:middle;dominant-baseline:central}
.wchips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.obj{pointer-events:none}
.obj>rect{fill:none;stroke:var(--mut);stroke-width:2px;stroke-dasharray:6 3;vector-effect:non-scaling-stroke}
.obj text{text-anchor:middle;dominant-baseline:central;fill:var(--ink);pointer-events:none}
.obj.sel>rect{stroke:var(--acc);stroke-width:4px}.obj.entry>rect{stroke:var(--acc);stroke-dasharray:none;stroke-width:3px}
#cv.lay .obj{pointer-events:all}#cv.lay .obj>rect{fill:rgba(128,128,128,.1)}
.node.cl-imm>rect{stroke-width:3px}.node.cl-light>rect{stroke-width:1.5px}
.node.dropt>rect{stroke:var(--acc);stroke-width:5px;stroke-dasharray:8 4;fill:var(--ok)}
.node.nodrop>rect{stroke:var(--red);stroke-dasharray:3 3}
button.dropt{outline:3px dashed var(--acc)}button.nodrop{outline:3px dashed var(--red)}
.sdh{cursor:grab;touch-action:none;user-select:none;padding:4px 6px;font-size:18px;color:var(--mut)}
.ghost{position:fixed;z-index:50;pointer-events:none;background:var(--acc);color:#fff;padding:4px 10px;border-radius:12px;font-size:13px}
.fs{border:0;padding:0;margin:0;min-width:0}.fs:disabled{opacity:.55}
.lnk{border:0;background:none;padding:0;min-height:0;color:var(--acc);text-decoration:underline;cursor:pointer;font-size:inherit}
.filters{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:flex-end}
.pg{padding:0 12px 40px}
button.on small,.chip.on small{color:inherit;opacity:.9}
.sg{position:fixed;z-index:60;background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.18);max-height:260px;overflow:auto}
.sg button{display:flex;width:100%;border:0;border-radius:0;text-align:left;gap:10px;justify-content:space-between;align-items:center;background:var(--card)}
.sg button.hl,.sg button:hover{background:var(--ok)}
.msg .lnk{margin-left:8px;font-weight:600}
.lv{display:inline-flex;gap:2px;align-items:center}.lv button{padding:0 10px;min-width:36px}
.fbtn{display:inline-flex;align-items:center;margin:0;padding:8px 12px;min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--inp);color:var(--ink);font-size:15px;cursor:pointer}
.warn.bk{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
@media(max-width:640px){table.dt,table.dt tbody,table.dt tr,table.dt td{display:block}table.dt tr:first-child{display:none}
table.dt tr.mr{border:1px solid var(--line);border-radius:10px;padding:8px;margin:10px 0 0;background:var(--bg)}
table.dt tr.xr{border:1px solid var(--line);border-top:0;border-radius:0 0 10px 10px;padding:4px 8px;margin:0 0 6px}
table.dt td{padding:3px 0;white-space:normal!important}table.dt td[data-l]::before{content:attr(data-l);display:block;font-size:12px;color:var(--mut)}
table.dt input[data-k=name],table.dt select[data-c=drl]{width:100%!important}table.dt td[data-l=Size] input{width:90px!important}}
/* ---- v5 ---- */
.dot.st3{background:var(--red)}
.node.st3>rect,.room.st3 rect{fill:var(--redbg);stroke:var(--red)}
.st3>.bd{fill:var(--red)}
.n.st3{border-color:var(--red);background:var(--redbg)}.n.st3 .ic{color:var(--red)}
.tile.st3{background:var(--redbg)}.gl2.st3{color:var(--red)}
.n{min-height:48px}.n .mut{font-size:22px}
/* container colours */
.node.hasc>rect{fill:color-mix(in srgb,var(--nc) 24%,var(--card))}
.node.hasc.st1>rect,.node.hasc.st2>rect,.node.hasc.st3>rect{stroke-width:4px}
.node.hasc:not(.sel):not(.st1):not(.st2):not(.st3):not(.share)>rect{stroke:var(--nc)}
.sws{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0}
.sw{width:30px;height:30px;min-height:30px;padding:0;border-radius:50%;border:2px solid var(--card);box-shadow:0 0 0 1px var(--line)}
.sw.on{box-shadow:0 0 0 3px var(--ink)}
.cdot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}
/* height layering and overlap */
.node.up>rect{fill-opacity:.62;stroke-width:1.5px}
.node.dash>rect{stroke-dasharray:6 4;fill:rgba(128,128,128,.07);stroke:var(--mut)}
.node.share>rect{stroke:var(--acc);stroke-dasharray:7 4;stroke-width:3px}
.node.sel>rect{stroke-dasharray:none}
.node text.tg{fill:var(--mut);font-weight:600}
.obj.dash>rect{stroke-opacity:.55}
.bub{position:fixed;z-index:70;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.25);padding:8px;display:flex;flex-direction:column;gap:6px;min-width:170px}
.bub button{text-align:left;min-height:44px}
/* sidebar cards and pills */
.cards{display:flex;flex-direction:column;gap:8px}
.cc{border:1px solid var(--line);border-left:6px solid var(--nc,var(--line));border-radius:12px;background:var(--card);padding:4px 6px}
.cc.sel{outline:2px solid var(--acc)}
.cc .cc{background:var(--bg);margin-top:6px}
.chd{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-height:40px}
.cnm{border:0;background:none;text-align:left;font-weight:600;padding:4px 2px;min-height:36px}
.cb{padding:2px 4px 8px 22px;display:flex;flex-direction:column;gap:6px}
.pills{display:flex;flex-wrap:wrap;gap:6px;align-items:flex-start}
.ip{border-radius:16px;padding:4px 12px;min-height:34px;background:var(--bg);font-size:14px}
.ip.st1{background:var(--ambbg);border-color:var(--amb)}.ip.st2,.ip.st3{background:var(--redbg);border-color:var(--red)}
.ip.on{border-color:var(--acc);background:var(--ok);font-weight:600}
.grp.xb{flex:1 1 100%;border:1px solid var(--line);border-radius:10px;padding:6px 8px;background:var(--card)}
.card.pinned{border-left-width:6px}
/* notification card */
.ncard{max-width:460px;margin:0 auto}
.ncard h2{margin-top:2px}
.where{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin:6px 0 10px}
.cl2{border:1px solid var(--line);border-radius:12px;padding:1px 10px;font-size:13px;background:var(--bg)}
.why{border-left:6px solid var(--mut);border-radius:8px;padding:8px 12px;margin:8px 0;background:var(--bg)}
.why.st1{border-color:var(--amb);background:var(--ambbg)}.why.st2,.why.st3{border-color:var(--red);background:var(--redbg)}
/* place picker */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin:8px 0}
.pt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border-left:6px solid var(--nc,var(--line));min-height:84px;padding:8px 10px}
.pt svg:not(.dot0){width:44px;height:30px}.pt.on{outline:3px solid var(--acc)}
dialog:has(.ncard){width:min(94vw,520px)}
.pt.flat{width:100%;min-height:40px;margin:3px 0;flex-direction:row}
.pcr{margin:8px 0 2px;font-size:14px}.phint{margin:6px 0}

.shl{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding:6px 2px}.shl.dn span{text-decoration:line-through;color:var(--mut)}.need{color:var(--amb);white-space:nowrap}
.mapwrap h3{margin:16px 0 4px;font-size:15px}
.chartbox{margin:8px 0}.chart{width:100%;height:auto;max-width:720px;display:block}.chart .bf{fill:var(--acc)}.chart .bf.cw{fill:var(--c2)}.chart .gl{stroke:var(--line);stroke-width:1;opacity:.6}.chart .ax{fill:var(--mut);font-size:10px}.chart .bar{cursor:pointer}.chart .bar:hover .bf{opacity:.8}
:root{--c2:#7a5ea8}@media(prefers-color-scheme:dark){:root{--c2:#b79be0}}
table.lt{width:100%;border-collapse:collapse;font-size:14px}table.lt th{text-align:left;color:var(--mut);font-weight:600;border-bottom:1px solid var(--line);padding:4px 6px}table.lt td{border-bottom:1px solid var(--line);padding:5px 6px;vertical-align:top}
details.snz{margin-top:14px}

.putin{position:fixed;z-index:60;pointer-events:none;padding:5px 12px;border-radius:14px;font-size:14px;font-weight:600;box-shadow:0 2px 8px #0003;white-space:nowrap}.putin.ok{background:var(--acc);color:#fff}.putin.no{background:var(--redbg);color:var(--red);border:1px solid var(--red)}
.gsr{display:block;width:100%;text-align:left;margin:4px 0;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font:inherit}
.scanov{position:fixed;inset:0;z-index:100;background:#000;display:flex;flex-direction:column}.scanov video{flex:1;min-height:0;width:100%;object-fit:cover}.scanbar{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px;background:#000;color:#fff}
pre.snp{max-height:240px;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;font-size:13px;white-space:pre-wrap}
.bcr{display:flex;gap:6px;margin-top:4px}

/* ================= v6c: shell, tokens, sheets ================= */
:root{--r:14px;--r-s:10px;--sh:0 1px 2px rgba(30,30,20,.06),0 6px 18px rgba(30,30,20,.07);--tabh:calc(64px + env(safe-area-inset-bottom,0px));--acc-soft:#dcebe5;--bg:#f4f3ee;--line:#dedcd2}
@media(min-width:761px){:root{--tabh:0px}}
@media(prefers-color-scheme:dark){:root{--acc-soft:#1f3a31;--sh:0 1px 2px rgba(0,0,0,.45),0 8px 22px rgba(0,0,0,.35);--bg:#141412;--line:#38372f}}
body{font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
button{border-radius:var(--r-s);min-height:42px;transition:background .12s,border-color .12s}
button:hover:not(:disabled):not(.on):not(.pri){background:var(--acc-soft)}
button.pri{font-weight:600}button.pri:hover{filter:brightness(1.08)}
input,select{border-radius:var(--r-s);min-height:40px}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
h2{font-size:19px;letter-spacing:-.01em}
.cvbox,.panel,.mapwrap,.notifs{border-radius:var(--r);box-shadow:var(--sh);border-color:transparent;padding:14px}
.tile{border-radius:var(--r-s);min-width:72px;padding:6px 12px}.tile b{font-size:20px}
.tile small{font-size:12px}
details{border-radius:var(--r-s)}
/* top bar */
nav.top{flex-wrap:nowrap;gap:4px;padding:6px 12px;border-bottom:1px solid var(--line);align-items:center}
nav.top .brand{font-weight:800;font-size:18px;letter-spacing:-.02em;color:var(--acc);padding:4px 8px 4px 0;min-height:40px}
nav.top .sp{flex:1}
nav.top .dtab{border:0;background:none;padding:6px 14px;border-radius:999px;color:var(--ink)}
nav.top .dtab.on{background:var(--acc-soft);color:var(--acc);font-weight:700}
nav.top .ib{border:0;background:none;font-size:18px;min-width:42px;padding:0 8px}
nav.top .pm{display:none}
.tabs{display:none}
@media(max-width:760px){
 nav.top .dtab,nav.top .dsp{display:none}
 nav.top .pm{display:inline-flex;align-items:center;justify-content:center}
 body{padding-bottom:var(--tabh)}
 .tabs{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:8;height:var(--tabh);padding:4px 4px env(safe-area-inset-bottom,0);background:var(--card);border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(0,0,0,.06)}
 .tabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:0;background:none;border-radius:var(--r-s);font-size:11px;font-weight:600;color:var(--mut);min-height:0;padding:2px}
 .tabs button.on{color:var(--acc);background:var(--acc-soft)}
 .tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
 .tabs button.plus{flex:0 0 58px;margin:-18px 4px 0;height:58px;border-radius:50%;background:var(--acc);color:#fff;box-shadow:0 4px 12px rgba(31,111,92,.45);font-size:0}
 .tabs button.plus svg{width:28px;height:28px;stroke-width:2.4}
}
.clock{padding:8px 16px 0}
/* messages become toasts (top layer, so they also show above a pop-up) */
#toast{position:fixed;inset:auto 12px calc(var(--tabh) + 14px) 12px;margin:0 auto;width:fit-content;max-width:min(560px,calc(100vw - 24px));background:var(--ink);color:var(--bg);border:0;border-radius:var(--r-s);padding:10px 16px;box-shadow:0 8px 24px rgba(0,0,0,.3);font-size:14px}
#toast .lnk{color:inherit;font-weight:700;margin-left:10px}
/* room page */

 document.body.appendChild(b);const r=b.getBoundingClientRect();b.style.left=clamp(x-r.width/2,6,window.innerWidth-r.width-6)+'px';b.style.top=clamp(y+10,6,window.innerHeight-r.height-6)+'px'}

/* ---------- room view: summary sidebar ---------- */
function tiles(rs){const red=rs.filter(r=>stat(r)===2).length,amb=rs.filter(r=>stat(r)===1).length,chk=rs.filter(r=>!r.open&&r.check==='pending').length,uns=rs.filter(r=>stat(r)===3).length,flo=rs.filter(r=>stat(r)===4).length;

/* ---------- sidebar: containers are cards that fold out; items are name-only pills that expand in place ---------- */
const gkey=(nid,r)=>(nid||'')+'|'+r.list+'|'+String(r.name).trim().toLowerCase();
function groupBlock(g,nid,k){const sealed=g.filter(r=>!r.open).reduce((a,r)=>a+r.qty,0),op=g.filter(r=>r.open),di=dotInfo(g),pend=g.filter(r=>!r.open&&r.check==='pending');
 const head=`${sealed} sealed`+(op.length?` + ${op.length} open (${op.map(fracLabel).join(', ')})`:'')+(g.length>1?` · ${g.length} batches`:'');
 return `<div class="grp xb" data-gk="${esc(k)}"><div class="th"><button class="ip on st${di.st}" data-a="itog" data-k="${esc(k)}" data-gk="${esc(k)}" aria-expanded="true" title="Fold">${esc(g[0].name)} ▾</button><small class="mut">${esc(lname(g[0].list)||'')} — ${head}</small><span style="flex:1"></span><button data-a="useone" data-list="${esc(g[0].list)}" data-name="${esc(g[0].name)}" data-node="${nid||''}" data-room="${U.room}">Used one</button></div>`
  +pend.map(r=>`<div class="chk">❓ Check the best-before date on the next batch: <b>${r.exp?fmtDate(r.exp):'none'}</b> × ${r.qty} <button data-a="chkyes" data-id="${r.id}">Yes, correct</button><button data-a="chkchg" data-id="${r.id}">Change</button></div>`).join('')
  +[...g].sort((a,b)=>(a.open-b.open)||fifoCmp(a,b)).map(recRow).join('')+'</div>'}
function pillsHTML(nid){const rs=directStock(U.room,nid);if(!rs.length)return'';
 const gs=groupsOf(rs).sort((a,b)=>Math.max(...b.map(stat))-Math.max(...a.map(stat))||a[0].name.localeCompare(b[0].name));
 return `<div class="pills">`+gs.map(g=>{const k=gkey(nid,g[0]),st=g.reduce((a,r)=>smax(a,stat(r)),0),chk=g.some(r=>!r.open&&r.check==='pending');
  if(U.sb.items[k])return groupBlock(g,nid,k);
  return `<button class="ip st${st}" data-a="itog" data-k="${esc(k)}" data-gk="${esc(k)}" aria-expanded="false">${esc(g[0].name)}${st?` <span class="gl2 st${st}">${G[st]}</span>`:''}${chk?' ❓':''}</button>`}).join('')+`</div>`}
const itemsOf=rs=>rs.reduce((a,r)=>a+(r.open?1:r.qty),0);
const subStock=(rid,nid)=>{const ids=nid?new Set(subtree(nid)):null;return S.stock.filter(r=>r.room===rid&&(!ids||ids.has(r.node)))};
function wallLabel(R,n){if(!rWall(R)||n.parent)return'';const a=againstWalls(R,n);return a.length?a.map(i=>R.walls[i].name).join(' + '):'middle of room'}
function cardHTML(n){const R=room(U.room),rs=subStock(U.room,n.id),own=directStock(U.room,n.id),st=worst(U.room,n.id),sel=U.sel===n.id,op=!!U.sb.open[n.id],col=ncol(n),ch=sortPos(kids(n.id,U.room)),cnt=itemsOf(rs),wl=wallLabel(R,n);
 let h=`<div class="cc${sel?' sel':''}${op?' open':''}${col?' hasc':''}" data-ck="${n.id}" ${col?`style="--nc:var(--pc-${col})"`:''}><div class="chd"><button class="arr" data-a="cfold" data-id="${n.id}" aria-expanded="${op}" aria-label="${op?'Fold':'Unfold'} ${esc(n.name)}">${op?'▾':'▸'}</button><button class="cnm" data-a="tsel" data-id="${n.id}">${esc(n.name)}</button><span class="cl">${esc(clsOf(n.type).name)}</span><span style="flex:1"></span><span class="pops">${dotsHTML(own)}</span><small>${cnt} item${cnt===1?'':'s'}</small>${st?`<span class="gl2 st${st}">${G[st]}</span>`:''}${hasInterior(n)?`<button class="arr" data-a="topen" data-id="${n.id}" title="Open inside" aria-label="Open ${esc(n.name)}">⤢</button>`:''}</div>`;
 if(op){h+=`<div class="cb">`+(wl?`<small class="mut">Against wall: ${esc(wl)}</small>`:'');if(!ch.length&&!own.length)h+='<small class="mut">Empty.</small>';h+=ch.map(cardHTML).join('')+pillsHTML(n.id)+'</div>'}
 return h+'</div>'}
function shareHTML(sel){const o=overlapsOf(sel,ctx());if(!o.length)return'';
 return `<div class="card"><small class="mut">Shares its spot with, lowest first:</small><br>${o.map(m=>`<button class="chip" data-a="tsel" data-id="${m.id}">${esc(m.name)}${nz(m)>0?` <small>+${+nz(m).toFixed(2)} m</small>`:''}</button>`).join('')}</div>`}

 const srt=S.prefs.fsort||'az',gs=groupsOf(rs);
 const qty=g=>itemsOf(g),ex=g=>Math.min(...g.map(expMs)),nm=g=>g[0].name.toLowerCase();
 gs.sort(srt==='qty'?(a,b)=>qty(b)-qty(a)||nm(a).localeCompare(nm(b)):srt==='exp'?(a,b)=>(ex(a)-ex(b)||0)||nm(a).localeCompare(nm(b)):(a,b)=>nm(a).localeCompare(nm(b)));

 if(!gs.length)return bar+'<p class="mut">Nothing stored here yet.</p>';
 return bar+`<div class="flat">`+gs.map(g=>{const k='f|'+g[0].list+'|'+g[0].name.trim().toLowerCase(),st=g.reduce((a,r)=>smax(a,stat(r)),0),o=!!U.sb.items[k],e=ex(g),d=e===Infinity?null:Math.round((e-today())/864e5);
  const when=d===null?'no date':d<0?'expired '+(-d)+' d':d===0?'due today':'in '+d+' d';
  const head=`<button class="fr st${st}${o?' open':''}" data-a="itog" data-k="${esc(k)}" aria-expanded="${o}"><span class="fn">${esc(g[0].name)}${g.some(r=>r.list==='unsorted')?' 📥':''}</span><span class="fq">× ${qty(g)}</span><span class="fe ${st?'gl2 st'+st:'mut'}">${st?G[st]+' ':''}${when}</span></button>`;
  if(!o)return head;
  return `<div class="grp xb">${head}`+[...g].sort((a,b)=>(a.open-b.open)||fifoCmp(a,b)).map(r=>`<div class="loc">📍 ${esc(pathOf(r))}${r.node&&node(r.node)?` <button class="lnk" data-a="locate" data-id="${r.node}">Show on map</button>`:''}</div>${recRow(r)}`).join('')+`</div>`}).join('')+`</div>`}

 if(U.mode==='layout'&&c!=='front')h+=`<div><small class="mut">Add object:</small> ${Object.keys(OB).map(k=>`<button class="chip" data-a="addobj" data-k="${k}">${OB[k].g} ${OB[k].n}</button>`).join('')}</div>`;

 if(directStock(U.room,U.parent||null).length)h+=`<h3>${vp?'Items directly in '+esc(vp.name):'Items on the floor'}</h3>`+pillsHTML(U.parent||null);

ACT.cfold=b=>{const id=b.dataset.id;if(U.sb.open[id])delete U.sb.open[id];else U.sb.open[id]=1;render()};

function editCard(n){const R=room(n.room),can=canEdit(n),cl=clsOf(n.type),col=ncol(n),top=!n.parent;

 if(top)h+=`<label>Height off the floor (m)<input type="number" step="0.05" min="0" data-c="nz" value="${+nz(n).toFixed(2)}" style="width:90px"></label>`;

 return h}

 return `<div class="card"><b>${OB[o.kind].g} ${esc(o.label||OB[o.kind].n)}</b>${o.entry?' <small>entry door</small>':''}

CH.olabel=el=>{const o=obj(U.selObj);if(!o)return;const old=o.label;o.label=el.value.trim();pushUndo('Edit label',()=>{o.label=old});save();render()};

CH.osize=el=>{const o=obj(U.selObj);if(!o||!o.top)return;const k=el.dataset.k,v=Math.max(.05,+el.value||.05),c=ctx(),old=JSON.parse(JSON.stringify(o)),R=room(o.room);
 if(c==='wall'){const s=SIDE(wallIdx(R,U.wall)),a=walong(R,o.top,s);if(k==='w')setAlong(R,o.top,s,a.a,v);else o.oh=v}else o.top[k]=v;
 pushUndo('Resize object',()=>{Object.keys(o).forEach(x=>delete o[x]);Object.assign(o,old)});save();render()};

ACT.addobj=b=>{const k=b.dataset.k,def=OB[k],c=ctx();if(c==='front')return;const {W,H}=dims(),R=room(U.room);
 const o={id:uid(),room:U.room,kind:k,label:k==='label'?'Label':'',top:null};
 if(c==='plan'){const sp=freeSpot(def.tw,def.th,W,H,S.objs.filter(x=>x.room===U.room&&x.top).map(x=>x.top));o.top={x:sp.x,y:sp.y,w:def.tw,h:def.th}}
 else{const wi=wallIdx(R,U.wall),wh=Math.min(def.wh,H),sibs=S.objs.filter(x=>x.room===U.room&&x.top).map(x=>ogeo(x,'wall')).filter(g=>g&&!g.dash),sp=freeSpot(def.ww,wh,W,H,sibs);
  o.z=Math.min(def.wy,H-wh);o.oh=wh;o.top=wallToTop(R,wi,sp.x,def.ww,def.th)}
 S.objs.push(o);U.selObj=o.id;U.sel=null;pushUndo('Add '+OB[k].n,()=>{S.objs=S.objs.filter(x=>x!==o)});save();render()};

CH.nsize=el=>{const n=node(U.sel);if(!n)return;const k=el.dataset.k,o={w:n.w,h:n.h,fh:n.fh},{W,H}=pdims(n);
 if(k==='fh')n.fh=Math.max(.05,+el.value||fh(n));else{n[k]=Math.max(.05,+el.value||o[k]);n.w=Math.min(n.w,W);n.h=Math.min(n.h,H)}

/* put a unit against a wall: it keeps its place along that wall and its height, and moves to the wall edge */
function snapToWall(n,wid){const R=room(n.room),wi=wallIdx(R,wid),s=SIDE(wi),a=walong(R,n,s),WL=wallLen(R,wi),dep=s%2?n.w:n.h,r=wallToTop(R,wi,clamp(a.a,0,Math.max(0,WL-a.l)),a.l,dep);n.x=r.x;n.y=r.y}

CH.nz=el=>{const n=node(U.sel);if(!n||n.parent)return;const R=room(n.room),old=n.z,mx=R.wallView?Math.max(0,(R.ceil||2.4)-fh(n)):10;n.z=clamp(+el.value||0,0,mx);

let FSFULL=false; /* set by the last freeSpot call: true when nothing was free and it fell back to 0,0 */
function freeSpot(w,h,W,H,sibs){const st=Math.max(W,H)/40;FSFULL=false;
 for(let y=0;y<=H-h+1e-6;y+=st)for(let x=0;x<=W-w+1e-6;x+=st)
  if(!sibs.some(s=>x<s.x+s.w&&x+w>s.x&&y<s.y+s.h&&y+h>s.y))return{x:+x.toFixed(3),y:+y.toFixed(3)};
 FSFULL=true;return{x:0,y:0}}

function useOne(list,name,nid,rid){
 const rs=S.stock.filter(r=>r.list===list&&sameName(r.name,name)&&(nid===undefined||(r.node||null)===(nid||null))&&(!rid||r.room===rid));
 const opens=rs.filter(r=>r.open).sort((a,b)=>(a.openedOn||'').localeCompare(b.openedOn||''));
 if(opens.length){logMove('use',opens[0],opens[0].rem);noteResolved(opens[0],'Used up');S.stock=S.stock.filter(x=>x!==opens[0]);return}
 const sealed=rs.filter(r=>!r.open).sort(fifoCmp),r=sealed[0];if(!r)return;
 const sooner=sealed.find(x=>x!==r&&expMs(x)<expMs(r));

 takeSealed(r)}

let CKQ=null,CK=null;
function afterBatch(done){if(!S.prefs.batchCheck)return;
 const c=S.stock.filter(x=>!x.open&&x.list===done.list&&sameName(x.name,done.name));if(!c.length)return;
 const same=c.filter(x=>x.room===done.room),next=(same.length?same:c).sort(fifoCmp)[0];
 if(next.check==='ok')return;next.check='pending';
 let why='';if(next.noExp||!next.exp)why='This batch has no best-before date.';
 else if(!done.noExp&&done.exp&&expMs(next)<expMs(done))why='This batch expires before the one you just finished.';
 if(why)CKQ={id:next.id,why}}
function runCheckQueue(){const q=CKQ;CKQ=null;if(q)openCheck(q.id,q.why)}
function openCheck(id,why){const r=rec(id);if(!r)return;CK={id};
 modal(`<h2>Check the best-before date</h2><p>Next in line: <b>${esc(r.name)}</b> × ${r.qty}, ${r.exp&&!r.noExp?'best before <b>'+fmtDate(r.exp)+'</b>':'<b>no date</b>'}, delivered ${fmtDate(r.delivered)||'?'} — ${esc(pathOf(r))}</p>${why?`<p class="err">${esc(why)}</p>`:''}
 <label>Correct date<input data-c="ckdate" value="${esc(r.exp||'')}" placeholder="ddmmyy / mmyy" style="width:130px"></label>${r.qty>1?`<label>Units with this date<input type="number" min="1" max="${r.qty}" data-c="ckqty" value="${r.qty}" style="width:90px"></label>`:''}
 <div class="err" id="ckerr"></div><div class="row"><button class="pri" data-a="chkyes" data-id="${id}">Date is correct</button><button data-a="cksave">Save new date</button><button data-a="mclose">Check later</button></div>`)}
ACT.chkchg=b=>openCheck(b.dataset.id,'');
ACT.chkyes=b=>{const r=rec(b.dataset.id);if(r){if(r.check==='pending')S.resolved.push({id:uid(),at:new Date().toISOString(),name:r.name,place:pathOf(r),why:'Best-before date check',how:'Date confirmed'});r.check='ok';r.checkedOn=iso(today())}save();closeModal();render()};
ACT.cksave=()=>{const r=rec(CK.id);if(!r)return;const dv=dlg.querySelector('[data-c=ckdate]').value,p=parseFast(dv),qe=dlg.querySelector('[data-c=ckqty]');
 if(!p){$('#ckerr').textContent='That date isn’t valid. Use ddmmyy or mmyy.';return}

  const t=(toDate(r.delivered)||0)&&toDate(r.delivered).getTime();if(t>e.last)e.last=t});

/* one line per change. qty is in units (an open item counts as its remaining fraction). Off when the log is switched off in Settings. */
function logMove(kind,r,qty,extra){if(!S.prefs.log)return;
 const e={id:uid(),at:new Date().toISOString(),kind,list:r.list,name:r.name,qty:+(+qty).toFixed(3),place:room(r.room)?pathOf(r):'',open:!!r.open};

function whyText(r){const st=stat(r),d=days(r);if(st===3)return'Not in a list yet';if(st===4)return'On the floor';
 if(st===1||st===2)return d<0?'Expired '+(-d)+' d ago':d===0?'Best before today':'Expires in '+d+' d';
 if(!r.open&&r.check==='pending')return'Best-before date check';return''}
/* a notification that stops being true because of something you did goes to the Resolved log (always on) */
function noteResolved(r,how){const w=whyText(r);delete S.done[r.id];delete S.snooze[r.id];if(!w)return;
 S.resolved.push({id:uid(),at:new Date().toISOString(),name:r.name,place:room(r.room)?pathOf(r):'',why:w,how})}

 const oldKey=prodKey(r.list,r.name),newKey=prodKey(r.list,nm),codes=codesOf(ER.bc);
 codes.forEach(c=>{const o=Object.entries(S.products).find(([k,p])=>k!==newKey&&k!==oldKey&&(p.barcodes||[]).includes(c));if(o)e.push('Barcode '+c+' already belongs to '+(o[1].name||o[0]))});

  const targets=ER.all?S.stock.filter(x=>x.list===r.list&&sameName(x.name,oldName)):[r];targets.forEach(x=>{x.name=nm});

/* ---------- backup and restore ---------- */
const PRE='stockroom.prerestore';
function downloadFile(name,text,type){const blob=new Blob([text],{type:type||'text/plain;charset=utf-8'}),a=document.createElement('a');
 a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
const backupAge=()=>{const d=toDate(S.lastBackup?S.lastBackup.slice(0,10):S.created);return d?Math.max(0,Math.floor((today()-d)/864e5)):0};
/* from 60 days without a backup, a banner shows; "remind me" hides it for a week, after which it returns until you export */
const backupDue=()=>backupAge()>=60&&(!S.backupSnooze||S.backupSnooze<=iso(today()));
function backupBanner(){if(!backupDue())return'';const a=backupAge();
 return `<div class="warn bk"><b>Back up your data.</b> ${S.lastBackup?'The last backup was '+a+' days ago.':'No backup has been made yet ('+a+' days of data).'} Everything lives in this browser only. <button data-a="bkexport">Export backup</button> <button data-a="bksnooze">Remind me in a week</button></div>`}
ACT.bkexport=()=>{S.lastBackup=new Date().toISOString();S.backupSnooze=null;save();

 rd.onload=()=>restoreParse(String(rd.result),f.name);rd.onerror=()=>flashMsg('That file could not be read.');rd.readAsText(f);el.value=''};
function restoreParse(txt,fname){let o=null;try{o=JSON.parse(txt)}catch(x){}
 const d=o&&o.app==='stockroom'?o.data:o;
 const ok=d&&typeof d.v==='number'&&Array.isArray(d.rooms)&&Array.isArray(d.nodes)&&Array.isArray(d.stock)&&Array.isArray(d.lists)&&d.types&&typeof d.types==='object';
 if(!ok){modal('<h2>Not a Stockroom backup</h2><p>That file does not look like a backup made by this app. Nothing was changed.</p><div class="row"><button class="pri" data-a="mclose">Close</button></div>');return}
 if(d.v>6){modal('<h2>Made by a newer version</h2><p>This backup uses data format '+d.v+', which this version cannot read. Nothing was changed.</p><div class="row"><button class="pri" data-a="mclose">Close</button></div>');return}
 RS={d,fname};
 modal(`<h2>Restore this backup?</h2><p><b>${esc(fname)}</b>${o.exported?' · exported '+fmtDate(String(o.exported).slice(0,10)):''}</p>
 <p>It holds <b>${d.rooms.length}</b> room(s), <b>${d.nodes.length}</b> container(s) and <b>${d.stock.length}</b> stock record(s) (data format ${d.v}).</p>
 <p class="chk">Restoring <b>replaces everything</b> in this browser (now ${S.rooms.length} room(s), ${S.nodes.length} container(s), ${S.stock.length} record(s)). Your current data is kept in a safety slot, so you can switch back once from Settings.</p>
 <div class="row"><button class="danger" data-a="rgo">Replace my data</button><button data-a="mclose">Cancel</button></div>`)}
function swapData(d,msg){const keep=S;try{localStorage.setItem(PRE,JSON.stringify(keep))}catch(x){}
 S=d;try{migrate();if(!S.open)S.open={}}catch(x){S=keep;closeModal();flashMsg('That data could not be read: '+x.message);render();return}
 U.room=null;U.parent=null;U.sel=null;U.selObj=null;U.page='home';U.mode='use';U.undo=[];U.sb={open:{},items:{}};save();closeModal();flashMsg(msg);render()}

ACT.rundo=()=>{let d=null;try{d=JSON.parse(localStorage.getItem(PRE))}catch(x){}if(!d){flashMsg('Nothing in the safety slot.');return}

function valTile(rs){if(!S.prefs.cost)return'';let v=0,n=0,no=0;rs.forEach(r=>{if(r.cost!=null&&r.cost!==''){v+=+r.cost*(r.open?r.rem:r.qty);n++}else no++});
 return n?`<span class="tile"><b>${money(v)}</b><small>value${no?' · '+no+' no cost':''}</small></span>`:''}

const sigOf=r=>stat(r)+'|'+(r.exp||'')+'|'+(r.open?'o':'s')+'|'+(r.check||'');
const hiddenN=r=>{const d=S.done[r.id];if(d&&d===sigOf(r))return true;const s=S.snooze[r.id];return !!(s&&s>iso(today()))};
const snoozedList=()=>S.stock.filter(r=>S.snooze[r.id]&&S.snooze[r.id]>iso(today()));

/* ---- minimum levels (set per product in Edit); counted across all rooms ---- */
function prodTotals(){const m={};for(const r of S.stock){if(r.list==='unsorted')continue;const k=prodKey(r.list,r.name);(m[k]=m[k]||{have:0});m[k].have+=(r.open?1:r.qty)}return m}
function belowMin(){const t=prodTotals(),out=[];
 for(const k of Object.keys(S.products)){const p=S.products[k];if(!(+p.min>0))continue;const have=t[k]?t[k].have:0;
  if(have<+p.min)out.push({key:k,list:k.split('|')[0],name:p.name||k.split('|').slice(1).join('|'),have,min:+p.min,need:+p.min-have})}
 return out.sort((a,b)=>a.name.localeCompare(b.name))}
const nf=v=>String(+(+v).toFixed(2));

/* ---- shopping page ---- */
function shopText(){const l=belowMin().map(x=>'- '+x.name+' × '+nf(x.need)),m=S.shop.filter(x=>!x.done).map(x=>'- '+x.name+(x.qty?' × '+x.qty:''));return[...l,...m].join('\n')}

 return `<section class="mapwrap"><h2>Shopping list <small>${bm.length+man.filter(x=>!x.done).length} to buy</small></h2>
 <p class="mut"><small>Items appear here by themselves when the stock of a product drops below its minimum. Set a minimum with Edit on any item.</small></p>
 ${bm.length?`<h3>Below minimum</h3>`+bm.map(x=>`<div class="shl"><span><b>${esc(x.name)}</b><br><small class="mut">${esc(lname(x.list)||'')} · have ${nf(x.have)}, minimum ${nf(x.min)}</small></span><b class="need">buy ${nf(x.need)}</b></div>`).join(''):'<p class="mut">Nothing is below its minimum.</p>'}
 <h3>Also on the list</h3>
 ${man.length?man.map(x=>`<div class="shl ${x.done?'dn':''}"><label class="inl"><input type="checkbox" data-c="shtick" data-id="${x.id}" ${x.done?'checked':''}> <span>${esc(x.name)}${x.qty?' × '+esc(x.qty):''}</span></label><button class="lnk" data-a="shdel" data-id="${x.id}" aria-label="Remove ${esc(x.name)}">✕</button></div>`).join(''):'<p class="mut"><small>Nothing added by hand.</small></p>'}
 <div class="row"><input id="shn" placeholder="Add an item…" style="width:200px"><input id="shq" placeholder="qty" style="width:70px"><button data-a="shadd">Add</button></div>
 <div class="row"><button data-a="shcopy">Copy the list</button>${man.some(x=>x.done)?`<button data-a="shclr">Remove ticked</button>`:''}<button data-a="deliver">+ Delivery</button></div></section>`}
ACT.shadd=()=>{const n=($('#shn').value||'').trim();if(!n)return;S.shop.push({id:uid(),name:n,qty:($('#shq').value||'').trim(),done:false});save();render()};

/* ---- overview dashboard ---- */
const PERIODS={'4w':['Last 4 weeks',4,'w'],'12w':['Last 12 weeks',12,'w'],'12m':['Last 12 months',12,'m']};
function buckets(p){const[,n,u]=PERIODS[p],out=[],t=today();
 if(u==='w'){const d=new Date(t);d.setDate(d.getDate()-((d.getDay()+6)%7)); /* Monday of this week */
  for(let i=n-1;i>=0;i--){const s=new Date(d);s.setDate(s.getDate()-7*i);const e=new Date(s);e.setDate(e.getDate()+7);out.push({s,e,l:s.toLocaleDateString(LOC(),{day:'numeric',month:'short'})})}}
 else for(let i=n-1;i>=0;i--){const s=new Date(t.getFullYear(),t.getMonth()-i,1),e=new Date(t.getFullYear(),t.getMonth()-i+1,1);out.push({s,e,l:s.toLocaleDateString(LOC(),{month:'short'})})}
 return out}
function series(kinds,p){const b=buckets(p);b.forEach(x=>{x.v=0;x.c=0});
 for(const e of S.log){if(!kinds.includes(e.kind))continue;const t=new Date(e.at);const x=b.find(x=>t>=x.s&&t<x.e);if(x){x.v+=+e.qty||0;if(e.cost!=null)x.c+=(+e.qty||0)*e.cost}}
 return b}
function barChart(id,title,b,unit){const W=640,H=150,pl=34,pb=22,pt=8,mx=Math.max(1,...b.map(x=>x.v)),top=Math.ceil(mx),bw=(W-pl)/b.length,tot=b.reduce((a,x)=>a+x.v,0);
 const bars=b.map((x,i)=>{const h=x.v/top*(H-pb-pt),bx=pl+i*bw+bw*.2,w=bw*.6,y=H-pb-h,tip=x.l+': '+nf(x.v)+' '+unit;
  return `<g class="bar" data-a="bartip" data-tip="${esc(tip)}" data-chart="${id}" role="img" aria-label="${esc(tip)}"><rect x="${pl+i*bw}" y="${pt}" width="${bw}" height="${H-pb-pt}" fill="transparent"/>${x.v>0?`<rect x="${bx}" y="${y}" width="${w}" height="${Math.max(h,2)}" rx="3" class="bf ${id}"><title>${esc(tip)}</title></rect>`:''}<text x="${bx+w/2}" y="${H-6}" text-anchor="middle" class="ax">${(b.length>8&&i%2)?'':esc(x.l)}</text></g>`}).join('');
 const grid=[0,.5,1].map(f=>{const y=H-pb-f*(H-pb-pt);return `<line x1="${pl}" x2="${W}" y1="${y}" y2="${y}" class="gl"/><text x="${pl-5}" y="${y+4}" text-anchor="end" class="ax">${nf(f*top)}</text>`}).join('');
 return `<div class="chartbox"><div class="ct"><b>${title}</b> <small class="mut">${nf(tot)} ${unit} in total</small></div><svg viewBox="0 0 ${W} ${H}" class="chart" role="group" aria-label="${esc(title)}">${grid}${bars}</svg><div class="ctip mut" id="tip-${id}"><small>Tap a bar for its value.</small></div></div>`}
ACT.bartip=b=>{const t=$('#tip-'+b.dataset.chart);if(t)t.innerHTML='<small>'+esc(b.dataset.tip)+'</small>'};
ACT.ovp=b=>{U.ovp=b.dataset.p;render()};ACT.ovt=()=>{U.ovt=!U.ovt;render()};
function usageHTML(){const p=U.ovp||'12w',us=series(['use'],p),ds=series(['discard'],p),wasteVal=ds.reduce((a,x)=>a+x.c,0);
 const head=`<div class="row">${Object.keys(PERIODS).map(k=>`<button class="${k===p?'on':''}" data-a="ovp" data-p="${k}">${PERIODS[k][0]}</button>`).join('')}<button data-a="ovt">${U.ovt?'Show chart':'Show table'}</button></div>`;
 if(!S.prefs.log)return `<p class="mut"><small>The movement log is switched off in Settings, so there is nothing to chart.</small></p>`;
 if(!S.log.length)return `<p class="mut"><small>Nothing recorded yet. Used and thrown-away items will appear here.</small></p>`;
 const body=U.ovt?`<table class="lt"><tr><th>Period</th><th>Used</th><th>Thrown away</th>${S.prefs.cost?'<th>Waste value</th>':''}</tr>${us.map((x,i)=>`<tr><td>${esc(x.l)}</td><td>${nf(x.v)}</td><td>${nf(ds[i].v)}</td>${S.prefs.cost?`<td>${ds[i].c?money(ds[i].c):'–'}</td>`:''}</tr>`).join('')}</table>`
  :barChart('cu','Used',us,'items')+barChart('cw','Thrown away',ds,'items');
 const reasons={};S.log.filter(e=>e.kind==='discard'&&new Date(e.at)>=buckets(p)[0].s).forEach(e=>{reasons[e.reason||'No reason']=(reasons[e.reason||'No reason']||0)+(+e.qty||0)});
 const rl=Object.entries(reasons).sort((a,b)=>b[1]-a[1]);
 return `${head}${body}${rl.length?`<p class="mut"><small>Thrown away in this period: ${rl.map(([k,v])=>esc(k)+' '+nf(v)).join(' · ')}${S.prefs.cost&&wasteVal?' · worth '+money(wasteVal):''}</small></p>`:''}`}
function valueByList(){if(!S.prefs.cost)return'';const m={};let no=0;S.stock.forEach(r=>{if(r.cost!=null&&r.cost!==''){const L=lname(r.list)||'—';m[L]=(m[L]||0)+ +r.cost*(r.open?r.rem:r.qty)}else no++});
 const e=Object.entries(m).sort((a,b)=>b[1]-a[1]);if(!e.length)return `<h3>Stock value</h3><p class="mut"><small>No prices entered yet. Add a price per unit in a delivery or in Edit.</small></p>`;
 return `<h3>Stock value <small class="mut">${money(e.reduce((a,x)=>a+x[1],0))}</small></h3>${e.map(([k,v])=>`<div class="shl"><span>${esc(k)}</span><b>${money(v)}</b></div>`).join('')}${no?`<p class="mut"><small>${no} record${no===1?'':'s'} without a price are not counted.</small></p>`:''}`}
function overviewHTML(){const ex=S.stock.filter(r=>(stat(r)===1||stat(r)===2)).sort((a,b)=>days(a)-days(b)),bm=belowMin();
 return `<section class="mapwrap"><h2>Overview <button class="lnk" data-a="snap" style="float:right">Share a snapshot</button></h2>${tiles(S.stock)}
 <h3>Expired and expiring soon <small class="mut">${ex.length}</small></h3>
 ${ex.length?ex.slice(0,10).map(r=>{const d=days(r),st=stat(r);return `<div class="n st${st}" data-a="nopen" data-id="${r.id}" role="button" tabindex="0"><span class="ic">${G[st]}</span><div class="nt"><b>${esc(r.name)}</b> ${r.open?'(open)':'× '+r.qty} · <b>${d<0?'expired '+(-d)+' d ago':d===0?'due today':'in '+d+' d'}</b><br><small>${esc(pathOf(r))}</small></div><span class="mut">›</span></div>`}).join('')+(ex.length>10?`<p class="mut"><small>and ${ex.length-10} more, see Stock.</small></p>`:''):'<p class="mut"><small>Nothing is expired or close to its date.</small></p>'}
 <h3>Below minimum <small class="mut">${bm.length}</small></h3>
 ${bm.length?bm.slice(0,10).map(x=>`<div class="shl"><span><b>${esc(x.name)}</b> <small class="mut">have ${nf(x.have)} of ${nf(x.min)}</small></span><b class="need">buy ${nf(x.need)}</b></div>`).join('')+`<div class="row"><button data-a="page" data-p="shop">Open shopping list</button></div>`:'<p class="mut"><small>Nothing is below its minimum. Set minimums with Edit on an item.</small></p>'}
 ${valueByList()}${S.prefs.usage?`<details class="usg" data-usg ${S.prefs.usgOpen?'open':''}><summary>Usage and waste</summary>${usageHTML()}</details>`:''}${snoozedHTML()}</section>`}

const LF={kind:'',days:'30',q:'',lim:100};
function logHTML(){const tab=U.lt||'mv';
 const tabs=`<div class="row"><button class="${tab==='mv'?'on':''}" data-a="ltab" data-t="mv">Movements</button><button class="${tab==='rs'?'on':''}" data-a="ltab" data-t="rs">Resolved notifications</button></div>`;
 let body='';
 if(tab==='rs'){const l=[...S.resolved].reverse();
  body=l.length?`<table class="lt"><tr><th>When</th><th>Item</th><th>Why it was raised</th><th>How it ended</th></tr>${l.slice(0,LF.lim).map(e=>`<tr><td>${esc(new Date(e.at).toLocaleDateString(LOC(),{day:'numeric',month:'short'}))}</td><td>${esc(e.name)}<br><small class="mut">${esc(e.place)}</small></td><td>${esc(e.why)}</td><td>${esc(e.how)}</td></tr>`).join('')}</table>${l.length>LF.lim?`<div class="row"><button data-a="lmore">Show more</button></div>`:''}`:'<p class="mut">No resolved notifications yet.</p>'}
 else{
  const since=LF.days==='all'?0:Date.now()-LF.days*864e5,q=LF.q.trim().toLowerCase();
  const l=S.log.filter(e=>(!LF.kind||e.kind===LF.kind)&&new Date(e.at)>=since&&(!q||(e.name+' '+e.place).toLowerCase().includes(q))).reverse();
  body=(S.prefs.log?'':'<p class="mut"><small>The movement log is switched off in Settings; entries below are from before.</small></p>')

  +(l.length?`<table class="lt"><tr><th>When</th><th>What</th><th>Item</th><th>Amount</th><th>Where / note</th></tr>${l.slice(0,LF.lim).map(e=>`<tr><td>${esc(new Date(e.at).toLocaleString(LOC(),{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}))}</td><td>${esc(LOGK[e.kind]||e.kind)}</td><td>${esc(e.name)}</td><td>${e.qty?nf(e.qty):''}</td><td><small>${esc([e.reason,e.note,e.place].filter(Boolean).join(' · '))}</small></td></tr>`).join('')}</table><p class="mut"><small>${l.length} entr${l.length===1?'y':'ies'}${l.length>LF.lim?', newest '+LF.lim+' shown':''}</small></p>${l.length>LF.lim?`<div class="row"><button data-a="lmore">Show more</button></div>`:''}`:'<p class="mut">Nothing recorded for this filter.</p>');}
 return `<section class="mapwrap"><h2>Log</h2>${tabs}${body}<div class="row"><button class="danger" data-a="lclr">Clear ${tab==='rs'?'resolved log':'movement log'}</button></div></section>`}

 if(!DROP){if(b)b.remove();return}
 const nm=DROP.k==='r'?room(DROP.id)?.name:DROP.k==='n'?node(DROP.id)?.name:(DROP.id?node(DROP.id)?.name:room(U.room)?.name);

 b.className='putin '+(DROP.ok?'ok':'no');b.textContent=DROP.ok?'Put it in '+(nm||'here')+'…':'Can’t go in '+(nm||'here');
 b.style.left=LASTP.x+14+'px';b.style.top=LASTP.y-38+'px'}

/* ---- global search ---- */
let GS='';
ACT.gsearch=()=>{GS='';modal(`<h2>Search</h2><input id="gsq" data-i="gs" placeholder="item, list, place or barcode" style="width:100%" autocomplete="off" aria-label="Search"><div id="gsr"></div><div class="row"><button data-a="mclose">Close</button></div>`);$('#gsq').focus();drawGS()};
INP.gs=el=>{GS=el.value;drawGS()};
function searchAll(q){const toks=norm(q).split(/\s+/).filter(Boolean);if(!toks.length)return null;
 const hit=h=>{const t=norm(h);return toks.every(k=>t.includes(k))};

const csvCell=v=>{let t=v==null?'':String(v);if(/^[=+\-@\t\r]/.test(t)&&isNaN(+t))t="'"+t;return /[",\r\n;]/.test(t)?'"'+t.replace(/"/g,'""')+'"':t};
const csvOut=(head,rows)=>[head,...rows].map(r=>r.map(csvCell).join(',')).join('\r\n');
function csvParse(txt){txt=txt.replace(/^﻿/,'');const first=txt.split(/\r?\n/)[0]||'',d=first.split(';').length>first.split(',').length?';':',',rows=[];let row=[],f='',q=false;
 for(let i=0;i<txt.length;i++){const c=txt[i];
  if(q){if(c==='"'){if(txt[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
  else if(c==='"')q=true;else if(c===d){row.push(f);f=''}
  else if(c==='\n'||c==='\r'){if(c==='\r'&&txt[i+1]==='\n')i++;row.push(f);f='';if(row.some(x=>x.trim()!==''))rows.push(row);row=[]}
  else f+=c}
 row.push(f);if(row.some(x=>x.trim()!==''))rows.push(row);return rows}
const csvDate=v=>{v=String(v||'').trim();if(!v)return'';if(/^\d{4}-\d{2}-\d{2}$/.test(v))return v;const p=parseFast(v.replace(/[\/.\-\s]/g,''));return p||null};

function csvPreview(txt,fname){const rows=csvParse(txt);
 if(rows.length<2){modal(`<h2>Import</h2><p>The file has no data rows.</p><div class="row"><button data-a="mclose">Close</button></div>`);return}
 const cols=rows[0].map(h=>HMAP[hk(h)]||null);
 if(!cols.includes('name')){modal(`<h2>Import</h2><p>No “Name” column was found. Use <b>Download a template</b> in Settings to see the expected columns.</p><div class="row"><button data-a="mclose">Close</button></div>`);return}
 const mode=cols.includes('qty')?'stock':'prod',out=[],warn=[];
 rows.slice(1).forEach((r,i)=>{const g={};cols.forEach((k,j)=>{if(k)g[k]=(r[j]||'').trim().replace(/^'(?=[=+\-@])/,'')});const n='Line '+(i+2)+': ';
  if(!g.name){warn.push(n+'no name, skipped.');return}
  const L=g.list?(S.lists.find(l=>l.id!=='unsorted'&&norm(lname(l.id))===norm(g.list))||S.lists.find(l=>l.id!=='unsorted'&&norm(l.name)===norm(g.list))):null;if(g.list&&!L)warn.push(n+'list “'+g.list+'” not found, '+(mode==='stock'?'goes to Unsorted.':'skipped.'));
  const e={name:g.name,list:L?L.id:'unsorted',line:i+2};
  if(mode==='prod'&&!L){const pm=allProducts().find(x=>norm(x.name)===norm(g.name));if(!pm){warn.push(n+'“'+g.name+'” has no known list, skipped. Add a List column.');return}e.list=pm.list}
  if(g.cost!==undefined&&g.cost!==''){const c=parseFloat(g.cost.replace(',','.'));if(c>=0)e.cost=c;else warn.push(n+'cost ignored.')}
  if(g.size){const s=parseFloat(g.size.replace(',','.'));if(s>0)e.size=s}
  if(g.unit){const u=MEASURES.find(m=>m.toLowerCase()===g.unit.toLowerCase());if(u)e.measure=u;else warn.push(n+'unit “'+g.unit+'” ignored.')}
  if(g.min){const m=parseFloat(g.min.replace(',','.'));if(m>=0)e.min=m}
  if(g.bc)e.bcs=g.bc.split(/[\s;|]+/).filter(Boolean);
  if(mode==='stock'){const q=parseInt(g.qty,10);if(!(q>0)){warn.push(n+'quantity must be a whole number above 0, skipped.');return}
   const open=/^(y|yes|true|1)$/i.test(g.open||'');e.qty=open?1:q;e.open=open;if(open){const lv=parseFloat((g.level||'').replace(',','.'));e.rem=lv>0&&lv<=1?lv:.5}
   const d=csvDate(g.exp);if(d===null){warn.push(n+'best-before “'+g.exp+'” not understood, skipped.');return}e.exp=d;e.noExp=!d;
   const dl=csvDate(g.del);e.delivered=dl||stamp();
   let R=S.rooms.find(x=>norm(x.name)===norm(g.room||''));e.roomName=g.room||'';e.path=g.place||'';
   if(!R){if(g.room||!S.rooms[0]){e.missRoom=true;e.room=null}else{R=S.rooms[0];warn.push(n+'no room given, used '+R.name+'.')}}
   if(R){e.room=R.id;e.node=null;if(g.place){const segs=g.place.split(/\s*>\s*/).filter(Boolean);let pid=null,ok=true;
     for(const sg of segs){const nd=S.nodes.find(x=>x.room===R.id&&(x.parent||null)===pid&&norm(x.name)===norm(sg));if(!nd){ok=false;break}pid=nd.id}
     if(!ok){const lastSeg=segs[segs.length-1],nd=S.nodes.find(x=>x.room===R.id&&norm(x.name)===norm(lastSeg));if(nd){pid=nd.id;ok=true}}
     if(ok)e.node=pid;else e.missPath=true}}
   else if(g.place)e.missPath=true}
  out.push(e)});
 IM={mode,rows:out,warn,fname,fix:'create',fixRoom:S.rooms[0]?.id};{const ms=missingSummary(IM);if(ms.noName||!(ms.rooms.length||ms.places.length))IM.fix='room'}drawIM()}

const CAN_SCAN=typeof BarcodeDetector!=='undefined'&&!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia);
let SCN=null;
async function scanOnce(onCode){if(!CAN_SCAN||SCN)return;
 const ov=document.createElement('div');ov.className='scanov';ov.innerHTML='<video playsinline muted></video><div class="scanbar"><span>Point the camera at the barcode</span><button data-a="scancancel">Cancel</button></div>';(dlg.open?dlg:document.body).appendChild(ov);
 let stream,tm;SCN={stop:()=>{clearInterval(tm);if(stream)stream.getTracks().forEach(t=>t.stop());ov.remove();SCN=null}};
 try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false})}catch(e){SCN.stop();flashMsg('Camera not available: '+(e&&e.name==='NotAllowedError'?'permission was denied.':'no camera was found.'));render();return}
 if(!SCN){stream.getTracks().forEach(t=>t.stop());return}
 const v=ov.querySelector('video');v.srcObject=stream;try{await v.play()}catch(e){}
 let fm=['ean_13','ean_8','upc_a','upc_e','code_128','code_39','itf'];try{const sup=await BarcodeDetector.getSupportedFormats();fm=fm.filter(f=>sup.includes(f))}catch(e){}
 const det=new BarcodeDetector({formats:fm});
 tm=setInterval(async()=>{try{const r=await det.detect(v);if(r.length&&SCN){const c=r[0].rawValue;SCN.stop();onCode(c)}}catch(e){}},250)}

 const p=allProducts().find(x=>x.barcodes.includes(c));
 if(p){if(!row.name.trim()){row.name=p.name;row.list=p.list;row.listSet=false;row.auto=true;row.size=p.size;row.measure=p.measure;if(S.prefs.cost&&p.cost!=null)row.cost=p.cost;row.bcn='Known product: '+p.name}
  else if(!sameName(row.name,p.name))row.bcn='This barcode belongs to “'+p.name+'”.';else row.bcn='Known barcode.'}

/* decide where every existing stock record goes in the new layout: same id, else same name, else floor / Unsorted */
function lyPlan(L){const p={keep:0,byName:0,floor:0,unsorted:0,map:new Map()};const fr=L.rooms[0];
 const listMap=id=>{if(L.lists.some(l=>l.id===id))return id;const nm=listOf(id)?.name;const m=nm&&L.lists.find(l=>norm(l.name)===norm(nm));return m?m.id:'unsorted'};
 S.stock.forEach(r=>{let R=L.rooms.find(x=>x.id===r.room),viaName=false;if(!R){const nm=room(r.room)?.name;R=nm&&L.rooms.find(x=>norm(x.name)===norm(nm));if(R)viaName=true}
  let rm=R||fr,nd=null,lost=false;
  if(r.node){const n0=node(r.node);let n=L.nodes.find(x=>x.id===r.node&&x.room===rm.id);if(!n&&n0){n=L.nodes.find(x=>x.room===rm.id&&norm(x.name)===norm(n0.name));if(n)viaName=true}
   if(n)nd=n.id;else lost=true}
  const lid=listMap(r.list);if(lid==='unsorted'&&r.list!=='unsorted')p.unsorted++;
  if(!R||lost)p.floor++;else if(viaName)p.byName++;else p.keep++;
  p.map.set(r.id,{room:rm.id,node:nd,list:lid})});
 return p}

 <p>The file holds <b>${L.rooms.length}</b> room(s), <b>${L.nodes.length}</b> container(s) and <b>${L.lists.length}</b> item list(s).</p>
 <p class="chk">This <b>replaces</b> your rooms, containers, doors and windows, container types and item lists (now ${S.rooms.length} room(s), ${S.nodes.length} container(s)). Your stock, logs and settings stay.</p>

 const pk={};Object.keys(S.products).forEach(k=>{const i=k.indexOf('|'),lid=k.slice(0,i),nm=k.slice(i+1);let nl=lid;if(!L.lists.some(l=>l.id===lid)){const old=listOf(lid),mm=old&&L.lists.find(l=>norm(l.name)===norm(old.name));nl=mm?mm.id:null}
  if(nl){const nk=nl+'|'+nm;if(!pk[nk])pk[nk]=S.products[k]}});

function missingSummary(m){const rooms=new Set(),places=new Set();let noName=0;
 m.rows.forEach(e=>{if(e.missRoom){if(e.roomName)rooms.add(e.roomName);else noName++}if(e.missPath){const rn=e.roomName||room(e.room)?.name;if(rn)places.add(rn+' › '+e.path)}});
 return{rooms:[...rooms],places:[...places],noName,any:rooms.size||places.size||noName||m.rows.some(e=>e.missPath)}}
function missHTML(m){const s=missingSummary(m);if(!s.any)return'';
 const n=m.rows.filter(e=>e.missRoom||e.missPath).length;
 return `<div class="chk"><b>${n} line${n===1?'':'s'} point${n===1?'s':''} to places you don't have</b>${s.rooms.length?`<br><small>Rooms: ${s.rooms.map(esc).join(', ')}</small>`:''}${s.places.length?`<br><small>Containers: ${s.places.slice(0,6).map(esc).join('; ')}${s.places.length>6?'…':''}</small>`:''}
 <div><label class="inl"><input type="radio" name="fix" data-c="imfix" value="create" ${m.fix==='create'?'checked':''} ${s.noName||!(s.rooms.length||s.places.length)?'disabled':''}> Create the missing rooms and containers</label></div>

CH.imfix=el=>{IM.fix=el.value;drawIM()};CH.imroom=el=>{IM.fixRoom=el.value;IM.fix='room';drawIM()};
function createPlaces(){const m=IM;
 const mkRoom=name=>{let R=S.rooms.find(x=>norm(x.name)===norm(name));if(!R){R={id:uid(),name:name.trim(),w:4,l:3,lead:null,wallView:false,x:S.rooms.length?Math.max(...S.rooms.map(r=>r.x+r.w))+.5:0,y:0};S.rooms.push(R)}return R};
 const mkPath=(R,path)=>{let pid=null;path.split(/\s*>\s*/).filter(Boolean).forEach(seg=>{
   let n=S.nodes.find(x=>x.room===R.id&&(x.parent||null)===pid&&norm(x.name)===norm(seg));
   if(!n){const pn=pid?node(pid):null,can=pn?(S.types[pn.type]?.can||[]):(S.roomCan||[]),t=can.find(k=>S.types[k])||Object.keys(S.types)[0],def=S.types[t],pd=pn?{W:pn.w,H:pn.h}:{W:R.w,H:R.l};
    const w=+Math.min(def.w,pd.W*.6).toFixed(3),h=+Math.min(def.h,pd.H*.6).toFixed(3),sp=freeSpot(w,h,pd.W,pd.H,kids(pid,R.id));
    n={id:uid(),room:R.id,parent:pid,type:t,name:seg.trim(),x:sp.x,y:sp.y,w,h,fh:def.fh||.5};if(!pn)n.z=def.z||0;
    if(pn&&R.wallView){n.fh=+Math.min(def.fh||.5,fh(pn)*.9).toFixed(3);n.fv=freeSpot(n.w,n.fh,pn.w,fh(pn),rectsFront(pid,null))}
    S.nodes.push(n)}
   pid=n.id});return pid};
 m.rows.forEach(e=>{if(!(e.missRoom||e.missPath))return;
  if(m.fix==='create'&&(e.roomName||e.room)){const R=(e.room&&room(e.room))||mkRoom(e.roomName);e.room=R.id;e.node=e.path?mkPath(R,e.path):null}
  else{const R=room(m.fixRoom)||S.rooms[0];e.room=R.id;e.node=null}})}

/* move all of a stock line, or part of a sealed line, to a place (one undo step) */
function doStockMove(r,T,n){const old={room:r.room,node:r.node},label=placeLabel(T.room,T.node||null);
 if(r.open||n>=r.qty){const q=r.open?r.rem:r.qty;logMove('move',r,q,{to:label});r.room=T.room;r.node=T.node||null;pushUndo('Move '+r.name,()=>Object.assign(r,old));flashMsg((r.open?r.name:q+' × '+r.name)+' moved to '+label+'.',true)}
 else{logMove('move',r,n,{to:label});
  const same=S.stock.find(x=>x!==r&&!x.open&&x.list===r.list&&sameName(x.name,r.name)&&x.room===T.room&&(x.node||null)===(T.node||null)&&x.exp===r.exp&&(x.cost??'')===(r.cost??'')&&!!x.noExp===!!r.noExp&&JSON.stringify(x.vals)===JSON.stringify(r.vals)&&x.delivered===r.delivered);
  r.qty-=n;let tgt=same;if(same)same.qty+=n;else{tgt={...JSON.parse(JSON.stringify(r)),id:uid(),qty:n,room:T.room,node:T.node||null};S.stock.push(tgt)}
  pushUndo('Move '+r.name,()=>{r.qty+=n;if(same)same.qty-=n;else S.stock=S.stock.filter(x=>x!==tgt)});
  flashMsg(n+' × '+r.name+' moved to '+label+', '+r.qty+' stay.',true)}
 save();render()}
