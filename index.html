<script>
'use strict';
/* ---------- storage ----------
   KEY = permanent data, never purged.
   PURGE_ON_RELAUNCH = allowlist of named caches emptied at launch. Nothing else is ever touched. */
const KEY='stockroom.v1',TRASH='stockroom.trash';
const PURGE_ON_RELAUNCH=[TRASH];
let storageOK=true;
try{PURGE_ON_RELAUNCH.forEach(k=>localStorage.removeItem(k))}catch(e){storageOK=false}
const uid=()=>Math.random().toString(36).slice(2,9);
const ty=(w,h,fh,can,cls)=>({w,h,fh,can,cls});
/* container classes: array order = rank (first holds the rest). Built-ins can be renamed, never deleted. */
const CLS0=()=>[
 {id:'imm',name:'Immovable',edit:'setup',drag:false,room:false,exc:false,builtin:true},
 {id:'mob',name:'Mobile',edit:'use',drag:true,room:true,exc:false,builtin:true},
 {id:'light',name:'Light',edit:'use',drag:true,room:true,exc:false,builtin:true}];
const FH0={'Fridge':1.8,'Freezer':1.8,'Shelving unit':2,'Cupboard':1.2,'Back bar':1,'Shelf':.35,'Drawer':.2,'Crate':.3,'Tupperware':.12};

 roomCan:['Fridge','Freezer','Shelving unit','Cupboard','Back bar','Crate'],
 types:{'Fridge':ty(.7,.7,1.8,['Shelf','Drawer','Crate','Tupperware'],'imm'),'Freezer':ty(.7,.7,1.8,['Shelf','Drawer','Crate','Tupperware'],'imm'),
  'Shelving unit':ty(1.2,.4,2,['Shelf'],'imm'),'Cupboard':ty(.8,.5,1.2,['Shelf','Drawer','Crate','Tupperware'],'imm'),
  'Back bar':ty(2,.5,1,['Shelf','Crate'],'imm'),'Shelf':ty(.8,.3,.35,['Crate','Tupperware'],'imm'),'Drawer':ty(.6,.4,.2,['Crate','Tupperware'],'imm'),
  'Crate':ty(.4,.3,.3,['Tupperware'],'mob'),'Tupperware':ty(.2,.15,.12,[],'light')},
 rooms:[{id:'r1',name:'Kitchen',w:4,l:3,x:0,y:0,lead:null,wallView:false}],nodes:[],objs:[],

  {id:'clean',name:'Cleaning',lead:null,fields:[]},{id:'toil',name:'Toiletries',lead:null,fields:[]},{id:'unsorted',name:'Unsorted',lead:null,fields:[],builtin:true}],
 products:{},stock:[],batches:[]}}

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function toDate(v){if(!v||typeof v!=='string')return null;const p=v.split('-').map(Number);if(p.length<2||p.some(isNaN))return null;return p.length===2?new Date(p[0],p[1],0):new Date(p[0],p[1]-1,p[2])}

/* fast date entry: ddmmyy, ddmmyyyy, mmyy (month = last day of month), yyyy-mm[-dd]. '' = empty, null = invalid */
function parseFast(s){s=(s||'').trim();if(!s)return'';let y,m,d,x;
 if(x=s.match(/^(\d{4})-(\d{1,2})(?:-(\d{1,2}))?$/)){y=+x[1];m=+x[2];d=x[3]?+x[3]:0}

/* using stock: open items first (longest open first), then sealed oldest delivery first.

function useOne(list,name,nid,rid){

 const opens=rs.filter(r=>r.open).sort((a,b)=>(a.openedOn||'').localeCompare(b.openedOn||''));
 if(opens.length){logMove('use',opens[0],opens[0].rem);noteResolved(opens[0],'Used up');S.stock=S.stock.filter(x=>x!==opens[0]);return}
 const sealed=rs.filter(r=>!r.open).sort(fifoCmp),r=sealed[0];if(!r)return;
 const sooner=sealed.find(x=>x!==r&&expMs(x)<expMs(r));

function filtered(){const f=U.f,q=f.q.trim().toLowerCase();

  &&(!f.st||(f.st==='uns'?stat(r)===3:f.st==='red'?stat(r)===2:f.st==='amber'?stat(r)===1:f.st==='ok'?(stat(r)===0&&days(r)!==null):days(r)===null))
  &&(!q||(r.name+' '+pathOf(r)+' '+(listOf(r.list)?.name||'')).toLowerCase().includes(q)));
 const cmp={bb:(a,b)=>expMs(a)===expMs(b)?0:expMs(a)<expMs(b)?-1:1,name:(a,b)=>a.name.localeCompare(b.name),place:(a,b)=>pathOf(a).localeCompare(pathOf(b)),

let P=null;

 if(q){const m=[];S.rooms.forEach(r=>{if(r.name.toLowerCase().includes(q)&&!pvalid(r.id,null))m.push({room:r.id,node:null,label:r.name+' › floor'})});

/* ---------- autosuggest for item names (delivery) ---------- */
let SG=null;
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
/* every item name ever entered: the product registry (kept after stock reaches zero) plus current stock */
function allProducts(){const m=new Map();
 Object.entries(S.products).forEach(([k,p])=>{const i=k.indexOf('|');m.set(k,{key:k,list:k.slice(0,i),name:p.name||k.slice(i+1),measure:p.measure||'units',size:p.size||1,last:p.last||0,cost:p.cost,min:p.min,barcodes:p.barcodes||[]})});
 S.stock.forEach(r=>{const k=prodKey(r.list,r.name);let e=m.get(k);if(!e){const p=prod(r);e={key:k,list:r.list,name:String(r.name).trim(),measure:p.measure,size:p.size,last:0,cost:p.cost,min:p.min,barcodes:p.barcodes||[]};m.set(k,e)}
  const t=(toDate(r.delivered)||0)&&toDate(r.delivered).getTime();if(t>e.last)e.last=t});
 return[...m.values()].filter(p=>p.list!=='unsorted'&&listOf(p.list))}
/* names from every list at once; where a name exists in two lists both show, the most recently used first */
function suggest(q,i){const nq=norm(q);if(!nq)return[];
 return allProducts().filter(p=>(' '+norm(p.name)).includes(' '+nq)&&p.name!==q.trim())
  .sort((a,b)=>(norm(a.name).startsWith(nq)?0:1)-(norm(b.name).startsWith(nq)?0:1)||(b.last||0)-(a.last||0)||a.name.localeCompare(b.name)).slice(0,8)}
function showSG(el){const i=+el.dataset.r,items=suggest(el.value,i);if(!items.length){hideSG();return}
 SG={row:i,items,hl:-1};let d=document.getElementById('sg');if(!d){d=document.createElement('div');d.id='sg';d.className='sg';dlg.appendChild(d)}
 const r=el.getBoundingClientRect();d.style.left=r.left+'px';d.style.top=(r.bottom+2)+'px';d.style.minWidth=Math.max(r.width,240)+'px';drawSG()}
function drawSG(){const d=document.getElementById('sg');if(!d||!SG)return;d.hidden=false;
 d.innerHTML=SG.items.map((p,n)=>`<button type="button" data-a="sgpick" data-n="${n}" class="${n===SG.hl?'hl':''}"><span>${esc(p.name)}</span><small>${esc(listOf(p.list).name)}${p.measure!=='units'?' · '+p.size+' '+p.measure:p.size>1?' · '+p.size:''}</small></button>`).join('')}

INP.sg=showSG;
function pickSG(n){const it=SG.items[n],i=SG.row;hideSG();const ae=document.activeElement;if(ae&&ae.matches&&ae.matches('[data-i=sg]'))ae.blur(); /* flush the half-typed text first so it cannot overwrite the pick */
 const r=D.rows[i];r.name=it.name;r.size=it.size;r.measure=it.measure;if(S.prefs.cost&&it.cost!=null)r.cost=it.cost;r.list=it.list;r.auto=true;r.listSet=false;r.vals={};r.bad={};renderDeliver();const q=cell(i,'[data-k=qty]');if(q)q.focus()}
ACT.sgpick=b=>pickSG(+b.dataset.n);
document.addEventListener('mousedown',e=>{if(e.target.closest&&e.target.closest('#sg'))e.preventDefault()});
document.addEventListener('focusout',e=>{if(e.target.matches&&e.target.matches('[data-i=sg]'))setTimeout(hideSG,150)});
document.addEventListener('keydown',e=>{if(!SG||!e.target.matches||!e.target.matches('[data-i=sg]'))return;
 if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();SG.hl=(SG.hl+(e.key==='ArrowDown'?1:-1)+SG.items.length)%SG.items.length;drawSG()}

 return `<div class="rec"><span class="rt"><b>${esc(r.name)}</b> <small>${esc(listOf(r.list)?.name||'')}</small> — ${r.open?'open, '+fracLabel(r)+' left':'expected × '+r.qty+' sealed'}<br><small>${metaOf(r)}${r.countedOn?' · last counted '+fmtDate(r.countedOn):''}</small></span>${ctl}<small id="cd-${r.id}" class="mut"></small></div>`}
function countSheet(){C.step='sheet';const rs=scopeRecs().sort((a,b)=>pathOf(a).localeCompare(pathOf(b))||a.name.localeCompare(b.name)),by=new Map();
 rs.forEach(r=>{const k=pathOf(r);if(!by.has(k))by.set(k,[]);by.get(k).push(r)});
 modal(`<h2>Counting: ${esc(scopeLabel())}</h2><p class="mut" id="csum"></p>
 ${C.found.length?`<div class="chk">Found and added: ${C.found.map(f=>`<b>${esc(f.name)}</b> × ${f.qty} (${esc(f.place)})`).join(' · ')}</div>`:''}
 ${rs.length?[...by.entries()].map(([pl,g])=>`<div class="grp"><b>${esc(pl)}</b>${g.map(cRow).join('')}</div>`).join(''):'<p class="mut">No records in this scope yet. Use “Add item found” for anything you find.</p>'}

 <div class="row"><button class="pri" data-a="creview">Review</button><button data-a="cback">Back</button><button data-a="mclose">Cancel</button></div>`);
 rs.forEach(r=>updRow(r.id));updSum()}
function updRow(id){const r=rec(id),e=document.getElementById('cd-'+id);if(!e||!r)return;const st=crow(id);
 if(st.v==='')e.textContent='';

 else{const n=Number(st.v);e.textContent=(Number.isInteger(n)&&n>=0)?(n===r.qty?'matches':(n>r.qty?'+':'')+(n-r.qty)):'whole number please'}}

function countPlan(){const out=[];
 scopeRecs().forEach(r=>{const st=C.rows[r.id];if(!st||st.v===''){out.push({r,kind:'skip'});return}
  if(r.open){if(st.v==='gone')out.push({r,kind:'gone',exp:1,got:0});else if(st.v==='ok')out.push({r,kind:'match',exp:1,got:1});
   else{const nv=+st.v;out.push({r,kind:Math.abs(nv-r.rem)<.01?'match':'frac',exp:1,got:1,newRem:nv})}}
  else{const n=Number(st.v);if(!Number.isInteger(n)||n<0){out.push({r,kind:'bad'});return}out.push({r,kind:n===r.qty?'match':n===0?'gone':'diff',exp:r.qty,got:n})}});

function countReview(){C.step='review';const pl=countPlan(),n=k=>pl.filter(p=>p.kind===k).length,bad=pl.filter(p=>p.kind==='bad'),
 diffs=pl.filter(p=>['diff','gone','frac'].includes(p.kind)),skipped=pl.filter(p=>p.kind==='skip'),counted=pl.length-skipped.length-bad.length;
 modal(`<h2>Review the count</h2><p class="mut">${esc(scopeLabel())} · nothing has changed yet.</p>
 <div class="tiles"><span class="tile"><b>${n('match')}</b><small>match</small></span><span class="tile ${diffs.length?'st1':''}"><b>${diffs.length}</b><small>differ</small></span><span class="tile"><b>${C.found.length}</b><small>found</small></span><span class="tile"><b>${skipped.length}</b><small>not counted</small></span></div>
 ${bad.length?`<div class="err">${bad.map(p=>esc(p.r.name)).join(', ')}: enter a whole number of 0 or more, or go back.</div>`:''}
 ${diffs.length?`<div class="tw"><table><tr><th>Item</th><th>Place</th><th>Expected</th><th>Counted</th><th></th></tr>${diffs.map(p=>`<tr><td><b>${esc(p.r.name)}</b></td><td>${esc(pathOf(p.r))}</td><td>${p.r.open?'1 open ('+fracLabel(p.r)+')':p.exp}</td><td>${p.kind==='frac'?'1 open ('+(FRO.find(o=>Math.abs(o[0]-p.newRem)<.01)||[0,Math.round(p.newRem*100)+'%'])[1]+')':p.got}</td><td>${p.kind==='gone'?'🗑️ record deleted':p.kind==='frac'?'amount updated':(p.got>p.exp?'+':'')+(p.got-p.exp)}</td></tr>`).join('')}</table></div>`:'<p class="mut">No differences in what you counted.</p>'}

 ${skipped.length?`<details><summary>${skipped.length} not counted (they keep their current figure)</summary><div class="sb">${skipped.map(p=>esc(p.r.name)+' — '+esc(pathOf(p.r))).join('<br>')}</div></details>`:''}
 <div class="row"><button class="pri" data-a="capply" ${bad.length||(!counted&&!C.found.length)?'disabled':''}>Apply count</button><button data-a="cbacksheet">Back to the sheet</button><button data-a="mclose">Cancel</button></div>`)}

ACT.capply=()=>{const pl=countPlan();if(pl.some(p=>p.kind==='bad'))return;const t=iso(today()),rows=[];let matched=0,uncounted=0,gone=0;
 const lr=(r,exp,got,note,place)=>rows.push({list:r.list,listName:listOf(r.list)?.name||'',name:r.name,place:place||pathOf(r),expected:exp,counted:got,diff:got-exp,note:note||''});
 pl.forEach(p=>{const r=p.r,st=crow(r.id);
  if(p.kind==='skip'){uncounted++;return}
  r.countedOn=t;if(st.dc&&!r.open)r.check='pending';
  if(p.kind==='match'){matched++;return}
  if(p.kind==='frac'){const old=fracLabel(r);logMove('level',r,+(r.rem-p.newRem).toFixed(3),{note:'stocktake'});r.rem=p.newRem;lr(r,1,1,'amount '+old+' → '+fracLabel(r));return}
  if(p.kind==='diff'){const old=r.qty;logMove('count',r,p.got-old,{note:'stocktake'});r.qty=p.got;lr(r,old,p.got,'');return}
  if(p.kind==='gone'){const place=pathOf(r);lr(r,p.exp,0,'record deleted',place);logMove('count',r,-(r.open?r.rem:p.exp),{note:'stocktake: not found'});noteResolved(r,'Not found in stocktake');
   const key=prodKey(r.list,r.name);S.products[key]={...prod(r),name:(S.products[key]&&S.products[key].name)||r.name.trim()};
   S.stock=S.stock.filter(x=>x!==r);gone++;if(!r.open){afterBatch(r);CKQ=null}}});

 const nd=rows.length;C=null;save();closeModal();flashMsg(`Count applied: ${nd} difference${nd===1?'':'s'} logged${gone?', '+gone+' record(s) deleted':''}.`);render()};

/* ====================================================================
   v6 stage A: movement log, resolved log, throw away, edit record,
   backup and restore. Opt-in pieces (cost, log) are switched in Settings.
   ==================================================================== */
const LOGK={delivery:'Delivered',use:'Used',open:'Opened',level:'Level lowered',discard:'Thrown away',move:'Moved',count:'Count difference',edit:'Edited',remove:'Record removed'};
/* one line per change. qty is in units (an open item counts as its remaining fraction). Off when the log is switched off in Settings. */
function logMove(kind,r,qty,extra){if(!S.prefs.log)return;
 const e={id:uid(),at:new Date().toISOString(),kind,list:r.list,name:r.name,qty:+(+qty).toFixed(3),place:room(r.room)?pathOf(r):'',open:!!r.open};
 if(r.cost!=null&&r.cost!=='')e.cost=+r.cost;if(extra)Object.assign(e,extra);S.log.push(e)}
function whyText(r){const st=stat(r),d=days(r);if(st===3)return'Not in a list yet';
 if(st===1||st===2)return d<0?'Expired '+(-d)+' d ago':d===0?'Best before today':'Expires in '+d+' d';
 if(!r.open&&r.check==='pending')return'Best-before date check';return''}
/* a notification that stops being true because of something you did goes to the Resolved log (always on) */
function noteResolved(r,how){const w=whyText(r);delete S.done[r.id];delete S.snooze[r.id];if(!w)return;
 S.resolved.push({id:uid(),at:new Date().toISOString(),name:r.name,place:room(r.room)?pathOf(r):'',why:w,how})}

/* ---------- throw away (with a reason, so waste can be told apart from use) ---------- */
let DC=null;
const REASONS=['Expired','Damaged or spilled','Other'];
ACT.discard=b=>{const r=rec(b.dataset.id);if(!r)return;DC={id:r.id,qty:r.open?1:r.qty,reason:stat(r)===2?'Expired':'Damaged or spilled',nc:!!dlg.querySelector('.ncard')};renderDiscard()};
function renderDiscard(){const r=rec(DC.id);if(!r){closeModal();return}
 modal(`<h2>Throw away ${esc(r.name)}</h2><p class="mut"><small>${esc(pathOf(r))} · ${r.open?'open, '+fracLabel(r)+' left':'× '+r.qty+' sealed'}</small></p>
 ${!r.open&&r.qty>1?`<label>How many (of ${r.qty})<input type="number" min="1" max="${r.qty}" data-c="dcq" value="${DC.qty}" style="width:90px"></label>`:''}
 <label>Reason<select data-c="dcr">${REASONS.map(x=>`<option ${x===DC.reason?'selected':''}>${x}</option>`).join('')}</select></label>
 <div class="row"><button class="danger" data-a="dcgo">Throw away</button><button data-a="${DC.nc?'dcback':'mclose'}">Cancel</button></div>`)}
CH.dcq=el=>{const r=rec(DC.id);if(r)DC.qty=Math.max(1,Math.min(r.qty,Math.floor(+el.value)||1))};
CH.dcr=el=>{DC.reason=el.value};
ACT.dcback=()=>{const id=DC.id;DC=null;rec(id)?openNC(id):ncNext()};
ACT.dcgo=()=>{const r=rec(DC.id);if(!r)return;const n=r.open?r.rem:DC.qty,nc=DC.nc;
 logMove('discard',r,n,{reason:DC.reason});
 if(r.open){noteResolved(r,'Thrown away: '+DC.reason);S.stock=S.stock.filter(x=>x!==r)}
 else{r.qty-=DC.qty;if(r.qty<=0){noteResolved(r,'Thrown away: '+DC.reason);S.stock=S.stock.filter(x=>x!==r);afterBatch(r)}}
 DC=null;save();closeModal();render();if(CKQ)runCheckQueue();else if(nc)ncNext()};

/* ---------- edit an existing stock record (and the item-level facts about it) ---------- */
let ER=null;
const codesOf=s=>[...new Set(String(s||'').split(/[,;\s]+/).map(x=>x.trim()).filter(Boolean))];
ACT.sedit=b=>{const r=rec(b.dataset.id);if(!r)return;const p=prod(r);
 ER={id:r.id,name:r.name,all:true,qty:r.qty,rem:r.rem,exp:r.exp||'',noExp:!!r.noExp||!r.exp,delivered:r.delivered||'',cost:r.cost!=null?String(r.cost):'',
  size:p.size||1,measure:p.measure||'units',min:p.min!=null?String(p.min):'',bc:(p.barcodes||[]).join(', '),vals:{...r.vals},bad:{},dbad:{},nc:!!dlg.querySelector('.ncard')};renderEdit()};
function efField(f){const v=ER.vals[f.id];
 if(f.type==='yesno')return `<input type="checkbox" data-c="efval" data-f="${f.id}" data-t="yesno" ${v?'checked':''}>`;
 if(f.type==='choice')return `<select data-c="efval" data-f="${f.id}" data-t="choice"><option value=""></option>${(f.opts||'').split(',').map(s=>s.trim()).filter(Boolean).map(o=>`<option ${o===v?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
 return `<input ${f.type==='number'?'type="number" step="any"':''} data-c="efval" data-f="${f.id}" data-t="${f.type}" class="${ER.bad[f.id]?'bad':''}" value="${esc(v??'')}" ${f.type==='date'?'placeholder="ddmmyy / mmyy"':''} style="width:140px">`}
function renderEdit(){const r=rec(ER.id);if(!r){closeModal();return}const L=listOf(r.list),same=S.stock.filter(x=>x.list===r.list&&sameName(x.name,r.name)).length;
 modal(`<h2>Edit ${esc(r.name)}</h2><p class="mut"><small>${esc(listOf(r.list)?.name||'')} · ${esc(pathOf(r))}</small></p>
 <div class="ef"><label>Name<input data-c="ef" data-k="name" value="${esc(ER.name)}" style="width:180px"></label>
 ${r.open?`<label>Level<select data-c="ef" data-k="rem">${LEVELS.map(o=>`<option value="${o}" ${Math.abs(o-ER.rem)<.01?'selected':''}>${lvl(o)}</option>`).join('')}${LEVELS.some(o=>Math.abs(o-ER.rem)<.01)?'':`<option value="${ER.rem}" selected>${lvl(ER.rem)}</option>`}</select></label>`
  :`<label>Quantity (sealed)<input type="number" min="1" step="1" data-c="ef" data-k="qty" value="${esc(ER.qty)}" style="width:90px"></label>`}</div>
 ${same>1?`<label class="inl"><input type="checkbox" data-c="efall" ${ER.all?'checked':''}> If I change the name, rename all ${same} records of this item</label>`:''}
 <div class="ef"><label>Best before<input data-c="ef" data-k="exp" class="${ER.expBad?'bad':''}" value="${esc(ER.noExp?'':ER.exp)}" ${ER.noExp?'disabled':''} placeholder="ddmmyy / mmyy" style="width:120px"></label>
 <label class="inl"><input type="checkbox" data-c="efno" ${ER.noExp?'checked':''}> no date</label>
 <label>Delivered on<input data-c="ef" data-k="delivered" class="${ER.dbad.delivered?'bad':''}" value="${esc(ER.delivered)}" placeholder="ddmmyy" style="width:120px"></label>
 ${S.prefs.cost?`<label>Cost per unit (optional)<input type="number" min="0" step="any" data-c="ef" data-k="cost" value="${esc(ER.cost)}" style="width:110px"></label>`:''}</div>
 ${L.fields.length?`<div class="ef">${L.fields.map(f=>`<label>${esc(f.name)}${f.req?'*':''}${efField(f)}</label>`).join('')}</div>`:''}
 <h3>About the item (applies to every record of it)</h3>
 <div class="ef"><label>Size of one full unit<input type="number" min="0" step="any" data-c="ef" data-k="size" value="${esc(ER.size)}" style="width:90px"></label>
 <label>Measure<select data-c="ef" data-k="measure">${MEASURES.map(m=>`<option ${m===ER.measure?'selected':''}>${m}</option>`).join('')}</select></label>
 <label>Minimum to keep (units)<input type="number" min="0" step="any" data-c="ef" data-k="min" value="${esc(ER.min)}" placeholder="none" style="width:110px"></label>

ACT.eback=()=>{const id=ER.id;ER=null;rec(id)?openNC(id):ncNext()};
CH.ef=el=>{const k=el.dataset.k;
 if(k==='exp'||k==='delivered'){const p=parseFast(el.value);const bad=p===null||(k==='delivered'&&p==='');
  if(k==='exp'){ER.expBad=p===null;ER.exp=p===null?el.value:p}else{ER.dbad.delivered=bad&&el.value.trim()!=='';ER.delivered=p===null?el.value:p}
  if(p!==null&&p!=='')el.value=p;el.classList.toggle('bad',p===null)}
 else if(k==='rem')ER.rem=+el.value;else ER[k]=el.value};
CH.efall=el=>{ER.all=el.checked};
CH.efno=el=>{ER.noExp=el.checked;if(el.checked)ER.expBad=false;renderEdit()};
CH.efval=el=>{const f=el.dataset.f,t=el.dataset.t;
 if(t==='yesno')ER.vals[f]=el.checked;
 else if(t==='date'){const p=parseFast(el.value);ER.bad[f]=p===null;ER.vals[f]=p===null?el.value:p;if(p!==null)el.value=p;el.classList.toggle('bad',p===null)}
 else ER.vals[f]=el.value};
ACT.esave=()=>{const r=rec(ER.id);if(!r)return;const e=[],L=listOf(r.list),nm=String(ER.name).trim();
 if(!nm)e.push('Name is required.');
 if(!r.open&&!(Number.isInteger(+ER.qty)&&+ER.qty>0))e.push('Quantity must be a whole number above 0.');
 let exp='';if(!ER.noExp){const p=parseFast(ER.exp);if(!p)e.push('Best-before is not a valid date (or tick “no date”).');else exp=p}
 let dl=r.delivered||'';if(String(ER.delivered).trim()!==''){const p=parseFast(ER.delivered);if(!p)e.push('Delivered-on is not a valid date.');else dl=p}
 if(S.prefs.cost&&ER.cost!==''&&!(+ER.cost>=0))e.push('Cost must be a number of 0 or more, or empty.');
 if(!(+ER.size>0))e.push('Size must be above 0.');
 if(ER.min!==''&&!(+ER.min>=0))e.push('Minimum must be 0 or more, or empty.');
 L.fields.forEach(f=>{if(ER.bad[f.id])e.push(f.name+' is not a valid date.');else if(f.req&&f.type!=='yesno'&&(ER.vals[f.id]===undefined||ER.vals[f.id]===''))e.push(f.name+' is required.')});
 const oldKey=prodKey(r.list,r.name),newKey=prodKey(r.list,nm),codes=codesOf(ER.bc);
 codes.forEach(c=>{const o=Object.entries(S.products).find(([k,p])=>k!==newKey&&k!==oldKey&&(p.barcodes||[]).includes(c));if(o)e.push('Barcode '+c+' already belongs to '+(o[1].name||o[0]))});
 if(e.length){$('#eerr').innerHTML=e.map(esc).join('<br>');return}
 const ch=[],oldP=prod(r),oldName=r.name;
 if(nm!==oldName){ch.push('name '+oldName+' → '+nm);
  const targets=ER.all?S.stock.filter(x=>x.list===r.list&&sameName(x.name,oldName)):[r];targets.forEach(x=>{x.name=nm});
  if(oldKey!==newKey){if(S.products[oldKey]&&!S.products[newKey])S.products[newKey]={...S.products[oldKey]};
   if(!S.stock.some(x=>x.list===r.list&&sameName(x.name,oldName)))delete S.products[oldKey]}}
 const pp=S.products[newKey]||(S.products[newKey]={measure:oldP.measure,size:oldP.size});pp.name=nm;
 if(pp.measure!==ER.measure||pp.size!==+ER.size)ch.push('size '+(pp.size||1)+' '+(pp.measure||'units')+' → '+(+ER.size)+' '+ER.measure);
 pp.measure=ER.measure;pp.size=+ER.size;
 if(ER.min===''){if(pp.min!=null)ch.push('minimum removed');delete pp.min}else{if(pp.min!==+ER.min)ch.push('minimum '+(pp.min??'none')+' → '+(+ER.min));pp.min=+ER.min}
 const bOld=(pp.barcodes||[]).join(','),bNew=codes.join(',');if(bOld!==bNew)ch.push('barcodes changed');if(codes.length)pp.barcodes=codes;else delete pp.barcodes;
 if(S.prefs.cost&&ER.cost!=='')pp.cost=+ER.cost;
 if(r.open){if(Math.abs(r.rem-ER.rem)>1e-6){ch.push('level '+lvl(r.rem)+' → '+lvl(ER.rem));r.rem=ER.rem}}
 else if(r.qty!==+ER.qty){ch.push('quantity '+r.qty+' → '+(+ER.qty));r.qty=+ER.qty}
 const noE=ER.noExp;if(noE!==!!r.noExp||(!noE&&r.exp!==exp)){ch.push('best before '+(r.exp?fmtDate(r.exp):'none')+' → '+(noE?'none':fmtDate(exp)));r.exp=noE?'':exp;r.noExp=noE;if(!r.open&&r.check==='pending')r.check='ok'}
 if(dl!==r.delivered){ch.push('delivered '+fmtDate(r.delivered)+' → '+fmtDate(dl));r.delivered=dl}
 if(S.prefs.cost){const nc=ER.cost===''?undefined:+ER.cost;if(nc!==r.cost){ch.push('cost '+(r.cost??'none')+' → '+(nc??'none'));if(nc===undefined)delete r.cost;else r.cost=nc}}
 if(JSON.stringify(r.vals)!==JSON.stringify(ER.vals)){ch.push('extra fields');r.vals={...ER.vals}}
 if(ch.length)logMove('edit',r,0,{note:ch.join('; ')});
 const nc2=ER.nc,id=r.id;ER=null;mergeSealed();save();closeModal();render();if(nc2)(rec(id)?openNC(id):ncNext())};

/* ---------- backup and restore ---------- */
const PRE='stockroom.prerestore';
function downloadFile(name,text,type){const blob=new Blob([text],{type:type||'text/plain;charset=utf-8'}),a=document.createElement('a');
 a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
const backupAge=()=>{const d=toDate(S.lastBackup?S.lastBackup.slice(0,10):S.created);return d?Math.max(0,Math.floor((today()-d)/864e5)):0};
/* from 60 days without a backup, a banner shows; "remind me" hides it for a week, after which it returns until you export */
const backupDue=()=>backupAge()>=60&&(!S.backupSnooze||S.backupSnooze<=iso(today()));
function backupBanner(){if(!backupDue())return'';const a=backupAge();
 return `<div class="warn bk"><b>Back up your data.</b> ${S.lastBackup?'The last backup was '+a+' days ago.':'No backup has been made yet ('+a+' days of data).'} Everything lives in this browser only. <button data-a="bkexport">Export backup</button> <button data-a="bksnooze">Remind me in a week</button></div>`}
ACT.bkexport=()=>{S.lastBackup=new Date().toISOString();S.backupSnooze=null;save();
 downloadFile('stockroom-backup-'+iso(today())+'.json',JSON.stringify({app:'stockroom',format:6,exported:S.lastBackup,data:S}),'application/json');
 flashMsg('Backup saved as stockroom-backup-'+iso(today())+'.json. Keep it somewhere outside this browser.');if(dlg.open)openSettings();render()};

function restoreParse(txt,fname){let o=null;try{o=JSON.parse(txt)}catch(x){}

 const ok=d&&typeof d.v==='number'&&Array.isArray(d.rooms)&&Array.isArray(d.nodes)&&Array.isArray(d.stock)&&Array.isArray(d.lists)&&d.types&&typeof d.types==='object';

 if(d.v>6){modal('<h2>Made by a newer version</h2><p>This backup uses data format '+d.v+', which this version cannot read. Nothing was changed.</p><div class="row"><button class="pri" data-a="mclose">Close</button></div>');return}
 RS={d,fname};
 modal(`<h2>Restore this backup?</h2><p><b>${esc(fname)}</b>${o.exported?' · exported '+fmtDate(String(o.exported).slice(0,10)):''}</p>
 <p>It holds <b>${d.rooms.length}</b> room(s), <b>${d.nodes.length}</b> container(s) and <b>${d.stock.length}</b> stock record(s) (data format ${d.v}).</p>
 <p class="chk">Restoring <b>replaces everything</b> in this browser (now ${S.rooms.length} room(s), ${S.nodes.length} container(s), ${S.stock.length} record(s)). Your current data is kept in a safety slot, so you can switch back once from Settings.</p>
 <div class="row"><button class="danger" data-a="rgo">Replace my data</button><button data-a="mclose">Cancel</button></div>`)}

const sigOf=r=>stat(r)+'|'+(r.exp||'')+'|'+(r.open?'o':'s')+'|'+(r.check||'');
const hiddenN=r=>{const d=S.done[r.id];if(d&&d===sigOf(r))return true;const s=S.snooze[r.id];return !!(s&&s>iso(today()))};

/* ---- minimum levels (set per product in Edit); counted across all rooms ---- */
function prodTotals(){const m={};for(const r of S.stock){if(r.list==='unsorted')continue;const k=prodKey(r.list,r.name);(m[k]=m[k]||{have:0});m[k].have+=(r.open?1:r.qty)}return m}
function belowMin(){const t=prodTotals(),out=[];
 for(const k of Object.keys(S.products)){const p=S.products[k];if(!(+p.min>0))continue;const have=t[k]?t[k].have:0;
  if(have<+p.min)out.push({key:k,list:k.split('|')[0],name:p.name||k.split('|').slice(1).join('|'),have,min:+p.min,need:+p.min-have})}
 return out.sort((a,b)=>a.name.localeCompare(b.name))}
const nf=v=>String(+(+v).toFixed(2));

 ${bm.length?`<h3>Below minimum</h3>`+bm.map(x=>`<div class="shl"><span><b>${esc(x.name)}</b><br><small class="mut">${esc(listOf(x.list)?.name||'')} · have ${nf(x.have)}, minimum ${nf(x.min)}</small></span><b class="need">buy ${nf(x.need)}</b></div>`).join(''):'<p class="mut">Nothing is below its minimum.</p>'}
 <h3>Also on the list</h3>

 <div class="row"><input id="shn" placeholder="Add an item…" style="width:200px"><input id="shq" placeholder="qty" style="width:70px"><button data-a="shadd">Add</button></div>

const PERIODS={'4w':['Last 4 weeks',4,'w'],'12w':['Last 12 weeks',12,'w'],'12m':['Last 12 months',12,'m']};
function buckets(p){const[,n,u]=PERIODS[p],out=[],t=today();
 if(u==='w'){const d=new Date(t);d.setDate(d.getDate()-((d.getDay()+6)%7)); /* Monday of this week */
  for(let i=n-1;i>=0;i--){const s=new Date(d);s.setDate(s.getDate()-7*i);const e=new Date(s);e.setDate(e.getDate()+7);out.push({s,e,l:s.toLocaleDateString('en-GB',{day:'numeric',month:'short'})})}}
 else for(let i=n-1;i>=0;i--){const s=new Date(t.getFullYear(),t.getMonth()-i,1),e=new Date(t.getFullYear(),t.getMonth()-i+1,1);out.push({s,e,l:s.toLocaleDateString('en-GB',{month:'short'})})}
 return out}
function series(kinds,p){const b=buckets(p);b.forEach(x=>{x.v=0;x.c=0});
 for(const e of S.log){if(!kinds.includes(e.kind))continue;const t=new Date(e.at);const x=b.find(x=>t>=x.s&&t<x.e);if(x){x.v+=+e.qty||0;if(e.cost!=null)x.c+=(+e.qty||0)*e.cost}}
 return b}
function barChart(id,title,b,unit){const W=640,H=150,pl=34,pb=22,pt=8,mx=Math.max(1,...b.map(x=>x.v)),top=Math.ceil(mx),bw=(W-pl)/b.length,tot=b.reduce((a,x)=>a+x.v,0);
 const bars=b.map((x,i)=>{const h=x.v/top*(H-pb-pt),bx=pl+i*bw+bw*.2,w=bw*.6,y=H-pb-h,tip=x.l+': '+nf(x.v)+' '+unit;
  return `<g class="bar" data-a="bartip" data-tip="${esc(tip)}" data-chart="${id}" role="img" aria-label="${esc(tip)}"><rect x="${pl+i*bw}" y="${pt}" width="${bw}" height="${H-pb-pt}" fill="transparent"/>${x.v>0?`<rect x="${bx}" y="${y}" width="${w}" height="${Math.max(h,2)}" rx="3" class="bf ${id}"><title>${esc(tip)}</title></rect>`:''}<text x="${bx+w/2}" y="${H-6}" text-anchor="middle" class="ax">${(b.length>8&&i%2)?'':esc(x.l)}</text></g>`}).join('');
 const grid=[0,.5,1].map(f=>{const y=H-pb-f*(H-pb-pt);return `<line x1="${pl}" x2="${W}" y1="${y}" y2="${y}" class="gl"/><text x="${pl-5}" y="${y+4}" text-anchor="end" class="ax">${nf(f*top)}</text>`}).join('');
 return `<div class="chartbox"><div class="ct"><b>${title}</b> <small class="mut">${nf(tot)} ${unit} in total</small></div><svg viewBox="0 0 ${W} ${H}" class="chart" role="group" aria-label="${esc(title)}">${grid}${bars}</svg><div class="ctip mut" id="tip-${id}"><small>Tap a bar for its value.</small></div></div>`}
ACT.bartip=b=>{const t=$('#tip-'+b.dataset.chart);if(t)t.innerHTML='<small>'+esc(b.dataset.tip)+'</small>'};

function usageHTML(){const p=U.ovp||'12w',us=series(['use'],p),ds=series(['discard'],p),wasteVal=ds.reduce((a,x)=>a+x.c,0);
 const head=`<div class="row">${Object.keys(PERIODS).map(k=>`<button class="${k===p?'on':''}" data-a="ovp" data-p="${k}">${PERIODS[k][0]}</button>`).join('')}<button data-a="ovt">${U.ovt?'Show chart':'Show table'}</button></div>`;
 if(!S.prefs.log)return `<h3>Usage and waste</h3><p class="mut"><small>The movement log is switched off in Settings, so there is nothing to chart.</small></p>`;
 if(!S.log.length)return `<h3>Usage and waste</h3><p class="mut"><small>Nothing recorded yet. Used and thrown-away items will appear here.</small></p>`;
 const body=U.ovt?`<table class="lt"><tr><th>Period</th><th>Used</th><th>Thrown away</th>${S.prefs.cost?'<th>Waste value</th>':''}</tr>${us.map((x,i)=>`<tr><td>${esc(x.l)}</td><td>${nf(x.v)}</td><td>${nf(ds[i].v)}</td>${S.prefs.cost?`<td>${ds[i].c?money(ds[i].c):'–'}</td>`:''}</tr>`).join('')}</table>`
  :barChart('cu','Used',us,'items')+barChart('cw','Thrown away',ds,'items');
 const reasons={};S.log.filter(e=>e.kind==='discard'&&new Date(e.at)>=buckets(p)[0].s).forEach(e=>{reasons[e.reason||'No reason']=(reasons[e.reason||'No reason']||0)+(+e.qty||0)});
 const rl=Object.entries(reasons).sort((a,b)=>b[1]-a[1]);
 return `<h3>Usage and waste</h3>${head}${body}${rl.length?`<p class="mut"><small>Thrown away in this period: ${rl.map(([k,v])=>esc(k)+' '+nf(v)).join(' · ')}${S.prefs.cost&&wasteVal?' · worth '+money(wasteVal):''}</small></p>`:''}`}
function valueByList(){if(!S.prefs.cost)return'';const m={};let no=0;S.stock.forEach(r=>{if(r.cost!=null&&r.cost!==''){const L=listOf(r.list)?.name||'—';m[L]=(m[L]||0)+ +r.cost*(r.open?r.rem:r.qty)}else no++});
 const e=Object.entries(m).sort((a,b)=>b[1]-a[1]);if(!e.length)return `<h3>Stock value</h3><p class="mut"><small>No prices entered yet. Add a price per unit in a delivery or in Edit.</small></p>`;

 return `<section class="mapwrap"><h2>Overview <button class="lnk" data-a="snap" style="float:right">Share a snapshot</button></h2>${tiles(S.stock)}
 <h3>Expired and expiring soon <small class="mut">${ex.length}</small></h3>
 ${ex.length?ex.slice(0,10).map(r=>{const d=days(r),st=stat(r);return `<div class="n st${st}" data-a="nopen" data-id="${r.id}" role="button" tabindex="0"><span class="ic">${G[st]}</span><div class="nt"><b>${esc(r.name)}</b> ${r.open?'(open)':'× '+r.qty} · <b>${d<0?'expired '+(-d)+' d ago':d===0?'due today':'in '+d+' d'}</b><br><small>${esc(pathOf(r))}</small></div><span class="mut">›</span></div>`}).join('')+(ex.length>10?`<p class="mut"><small>and ${ex.length-10} more, see Stock.</small></p>`:''):'<p class="mut"><small>Nothing is expired or close to its date.</small></p>'}
 <h3>Below minimum <small class="mut">${bm.length}</small></h3>

 const tabs=`<div class="row"><button class="${tab==='mv'?'on':''}" data-a="ltab" data-t="mv">Movements</button><button class="${tab==='rs'?'on':''}" data-a="ltab" data-t="rs">Resolved notifications</button></div>`;

  +(l.length?`<table class="lt"><tr><th>When</th><th>What</th><th>Item</th><th>Amount</th><th>Where / note</th></tr>${l.slice(0,LF.lim).map(e=>`<tr><td>${esc(new Date(e.at).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}))}</td><td>${esc(LOGK[e.kind]||e.kind)}</td><td>${esc(e.name)}</td><td>${e.qty?nf(e.qty):''}</td><td><small>${esc([e.reason,e.note,e.place].filter(Boolean).join(' · '))}</small></td></tr>`).join('')}</table><p class="mut"><small>${l.length} entr${l.length===1?'y':'ies'}${l.length>LF.lim?', newest '+LF.lim+' shown':''}</small></p>${l.length>LF.lim?`<div class="row"><button data-a="lmore">Show more</button></div>`:''}`:'<p class="mut">Nothing recorded for this filter.</p>');}
 return `<section class="mapwrap"><h2>Log</h2>${tabs}${body}<div class="row"><button class="danger" data-a="lclr">Clear ${tab==='rs'?'resolved log':'movement log'}</button></div></section>`}

function searchAll(q){const toks=norm(q).split(/\s+/).filter(Boolean);if(!toks.length)return null;
 const hit=h=>{const t=norm(h);return toks.every(k=>t.includes(k))};
 const items=S.stock.filter(r=>hit(r.name+' '+(listOf(r.list)?.name||'')+' '+pathOf(r)+' '+(prod(r).barcodes||[]).join(' '))).slice(0,30);
 const have=new Set(S.stock.map(r=>prodKey(r.list,r.name)));
 const prods=allProducts().filter(p=>!have.has(p.key)&&hit(p.name+' '+p.barcodes.join(' ')+' '+(listOf(p.list)?.name||''))).slice(0,8);
 const nodes=S.nodes.filter(n=>hit(n.name+' '+n.type+' '+(room(n.room)?.name||''))).slice(0,10);
 const rooms=S.rooms.filter(r=>hit(r.name)).slice(0,5);
 const shop=S.shop.filter(x=>hit(x.name)).slice(0,5);
 return{items,prods,nodes,rooms,shop}}
function drawGS(){const el=$('#gsr');if(!el)return;const r=searchAll(GS);
 if(!r){el.innerHTML='<p class="mut"><small>Type part of a name, a place, a list or a barcode number.</small></p>';return}
 const n=r.items.length+r.prods.length+r.nodes.length+r.rooms.length+r.shop.length;
 if(!n){el.innerHTML='<p class="mut">Nothing found.</p>';return}
 const sec=(t,h)=>h?`<h3>${t}</h3>${h}`:'';
 el.innerHTML=sec('In stock',r.items.map(x=>{const d=days(x),st=stat(x);return `<button class="gsr" data-a="gsgo" data-id="${x.id}"><b>${esc(x.name)}</b> <small>${x.open?'open · '+fracLabel(x):'× '+x.qty}${x.exp&&!x.noExp?' · '+fmtDate(x.exp)+' '+(G[st]||''):''}</small><br><small class="mut">${esc(listOf(x.list)?.name||'')} · ${esc(pathOf(x))}</small></button>`}).join(''))
  +sec('Known products, not in stock',r.prods.map(p=>`<div class="gsr"><b>${esc(p.name)}</b> <small class="mut">${esc(listOf(p.list)?.name||'')}${p.min?' · minimum '+nf(p.min):''}</small></div>`).join(''))
  +sec('Containers',r.nodes.map(x=>`<button class="gsr" data-a="gsnode" data-id="${x.id}"><b>${esc(x.name)}</b> <small class="mut">${esc(x.type)} · ${esc(room(x.room)?.name||'')}</small></button>`).join(''))
  +sec('Rooms',r.rooms.map(x=>`<button class="gsr" data-a="gsroom" data-id="${x.id}"><b>${esc(x.name)}</b></button>`).join(''))
  +sec('Shopping list',r.shop.map(x=>`<div class="gsr">${esc(x.name)}${x.done?' <small class="mut">(ticked)</small>':''}</div>`).join(''))}
ACT.gsgo=b=>{closeModal();U.page=null;ACT.go(b)};
ACT.gsnode=b=>{const n=node(b.dataset.id);if(!n)return;closeModal();U.page=null;U.room=n.room;U.mode='use';U.view='top';U.selObj=null;U.sb={open:{},items:{}};U.parent=n.parent||null;selectNode(n.id);U.sb.open[n.id]=1;U.flash=n.id;render();U.flash=null};

/* ---- CSV ---- */
const csvCell=v=>{let t=v==null?'':String(v);if(/^[=+\-@\t\r]/.test(t)&&isNaN(+t))t="'"+t;return /[",\r\n;]/.test(t)?'"'+t.replace(/"/g,'""')+'"':t};
const csvOut=(head,rows)=>[head,...rows].map(r=>r.map(csvCell).join(',')).join('\r\n');
function csvParse(txt){txt=txt.replace(/^﻿/,'');const first=txt.split(/\r?\n/)[0]||'',d=first.split(';').length>first.split(',').length?';':',',rows=[];let row=[],f='',q=false;
 for(let i=0;i<txt.length;i++){const c=txt[i];
  if(q){if(c==='"'){if(txt[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
  else if(c==='"')q=true;else if(c===d){row.push(f);f=''}
  else if(c==='\n'||c==='\r'){if(c==='\r'&&txt[i+1]==='\n')i++;row.push(f);f='';if(row.some(x=>x.trim()!==''))rows.push(row);row=[]}
  else f+=c}
 row.push(f);if(row.some(x=>x.trim()!==''))rows.push(row);return rows}
const csvDate=v=>{v=String(v||'').trim();if(!v)return'';if(/^\d{4}-\d{2}-\d{2}$/.test(v))return v;const p=parseFast(v.replace(/[\/.\-\s]/g,''));return p||null};
const SCOL=['List','Name','Quantity','Open','Level left','Best before','Delivered','Room','Place','Cost per unit','Size','Unit','Barcode','Minimum'];
function csvStock(){return csvOut(SCOL,S.stock.map(r=>{const p=prod(r);return[listOf(r.list)?.name||'',r.name,r.open?1:r.qty,r.open?'yes':'',r.open?+(+r.rem).toFixed(3):'',r.noExp?'':r.exp||'',r.delivered||'',room(r.room)?.name||'',r.node?nodePath(r.node).join(' > '):'',r.cost??'',p.size??'',p.measure??'',(p.barcodes||[])[0]||'',p.min??'']}))}
function csvProducts(){return csvOut(['List','Name','Size','Unit','Cost per unit','Minimum','Barcodes'],allProducts().map(p=>[listOf(p.list)?.name||'',p.name,p.size,p.measure,p.cost??'',p.min??'',p.barcodes.join(' ')]))}
function csvLog(){return csvOut(['When','Type','List','Name','Amount','Open','Cost per unit','Reason','Note','Place'],S.log.map(e=>[e.at,LOGK[e.kind]||e.kind,listOf(e.list)?.name||'',e.name,e.qty,e.open?'yes':'',e.cost??'',e.reason||'',e.note||'',e.place||'']))}
const stamp=()=>iso(today());
ACT.csvx=b=>{const k=b.dataset.k;downloadFile('stockroom-'+({stock:'stock',prod:'products',log:'movement-log'})[k]+'-'+stamp()+'.csv','﻿'+({stock:csvStock,prod:csvProducts,log:csvLog})[k](),'text/csv;charset=utf-8')};
ACT.csvtpl=()=>downloadFile('stockroom-import-template.csv','﻿'+csvOut(SCOL,[['Food','Rice',2,'','','2027-03-01','','Kitchen','Pantry',1.2,1,'kg','5012345678900',2]]),'text/csv;charset=utf-8');
let IM=null;
CH.csvfile=el=>{const f=el.files&&el.files[0];el.value='';if(!f)return;const rd=new FileReader();rd.onload=()=>csvPreview(String(rd.result),f.name);rd.readAsText(f)};
const hk=h=>String(h).toLowerCase().replace(/[^a-z]/g,'');
const HMAP={list:'list',name:'name',item:'name',product:'name',quantity:'qty',qty:'qty',open:'open',levelleft:'level',level:'level',bestbefore:'exp',expiry:'exp',expires:'exp',delivered:'del',room:'room',place:'place',costperunit:'cost',cost:'cost',size:'size',unit:'unit',measure:'unit',barcode:'bc',barcodes:'bc',minimum:'min',min:'min'};
function csvPreview(txt,fname){const rows=csvParse(txt);
 if(rows.length<2){modal(`<h2>Import</h2><p>The file has no data rows.</p><div class="row"><button data-a="mclose">Close</button></div>`);return}
 const cols=rows[0].map(h=>HMAP[hk(h)]||null);
 if(!cols.includes('name')){modal(`<h2>Import</h2><p>No “Name” column was found. Use <b>Download a template</b> in Settings to see the expected columns.</p><div class="row"><button data-a="mclose">Close</button></div>`);return}
 const mode=cols.includes('qty')?'stock':'prod',out=[],warn=[];
 rows.slice(1).forEach((r,i)=>{const g={};cols.forEach((k,j)=>{if(k)g[k]=(r[j]||'').trim().replace(/^'(?=[=+\-@])/,'')});const n='Line '+(i+2)+': ';
  if(!g.name){warn.push(n+'no name, skipped.');return}
  const L=g.list?S.lists.find(l=>l.id!=='unsorted'&&norm(l.name)===norm(g.list)):null;if(g.list&&!L)warn.push(n+'list “'+g.list+'” not found, '+(mode==='stock'?'goes to Unsorted.':'skipped.'));
  const e={name:g.name,list:L?L.id:'unsorted',line:i+2};
  if(mode==='prod'&&!L){const pm=allProducts().find(x=>norm(x.name)===norm(g.name));if(!pm){warn.push(n+'“'+g.name+'” has no known list, skipped. Add a List column.');return}e.list=pm.list}
  if(g.cost!==undefined&&g.cost!==''){const c=parseFloat(g.cost.replace(',','.'));if(c>=0)e.cost=c;else warn.push(n+'cost ignored.')}
  if(g.size){const s=parseFloat(g.size.replace(',','.'));if(s>0)e.size=s}
  if(g.unit){const u=MEASURES.find(m=>m.toLowerCase()===g.unit.toLowerCase());if(u)e.measure=u;else warn.push(n+'unit “'+g.unit+'” ignored.')}
  if(g.min){const m=parseFloat(g.min.replace(',','.'));if(m>=0)e.min=m}
  if(g.bc)e.bcs=g.bc.split(/[\s;|]+/).filter(Boolean);
  if(mode==='stock'){const q=parseInt(g.qty,10);if(!(q>0)){warn.push(n+'quantity must be a whole number above 0, skipped.');return}
   const open=/^(y|yes|true|1)$/i.test(g.open||'');e.qty=open?1:q;e.open=open;if(open){const lv=parseFloat((g.level||'').replace(',','.'));e.rem=lv>0&&lv<=1?lv:.5}
   const d=csvDate(g.exp);if(d===null){warn.push(n+'best-before “'+g.exp+'” not understood, skipped.');return}e.exp=d;e.noExp=!d;
   const dl=csvDate(g.del);e.delivered=dl||stamp();
   let R=S.rooms.find(x=>norm(x.name)===norm(g.room||''));if(!R){R=S.rooms[0];warn.push(n+(g.room?'room “'+g.room+'” not found, used '+(R?.name||'none'):'no room given, used '+(R?.name||'none'))+'.')}
   if(!R){warn.push(n+'there is no room to put it in, skipped.');return}
   e.room=R.id;e.node=null;if(g.place){const last=g.place.split(/\s*>\s*/).pop(),nd=S.nodes.find(x=>x.room===R.id&&norm(x.name)===norm(last));if(nd)e.node=nd.id;else warn.push(n+'place “'+g.place+'” not found, put on the floor.')}}
  out.push(e)});
 IM={mode,rows:out,warn,fname};drawIM()}
function drawIM(){const m=IM;
 modal(`<h2>Import ${esc(m.fname)}</h2><p>${m.mode==='stock'?`<b>${m.rows.length}</b> stock line${m.rows.length===1?'':'s'} will be added to your stock (nothing is replaced).`:`<b>${m.rows.length}</b> product${m.rows.length===1?'':'s'} will be added or updated (stock is not touched).`}</p>
 ${m.rows.length?`<table class="lt"><tr><th>Name</th><th>List</th>${m.mode==='stock'?'<th>Qty</th><th>Best before</th><th>Where</th>':'<th>Size</th><th>Min</th>'}</tr>${m.rows.slice(0,8).map(e=>`<tr><td>${esc(e.name)}</td><td>${esc(listOf(e.list)?.name||'')}</td>${m.mode==='stock'?`<td>${e.open?'open '+nf(e.rem):e.qty}</td><td>${e.noExp?'none':esc(fmtDate(e.exp))}</td><td>${esc(placeLabel(e.room,e.node))}</td>`:`<td>${e.size?e.size+' '+(e.measure||''):''}</td><td>${e.min??''}</td>`}</tr>`).join('')}</table>${m.rows.length>8?`<p class="mut"><small>and ${m.rows.length-8} more.</small></p>`:''}`:''}
 ${m.warn.length?`<details open><summary>${m.warn.length} warning${m.warn.length===1?'':'s'}</summary><div class="err" style="max-height:140px;overflow:auto">${m.warn.slice(0,15).map(esc).join('<br>')}${m.warn.length>15?'<br>…':''}</div></details>`:''}
 <div class="row"><button class="pri" data-a="imgo" ${m.rows.length?'':'disabled'}>Import ${m.rows.length}</button><button data-a="mclose">Cancel</button></div>`)}
ACT.imgo=()=>{const m=IM;if(!m)return;IM=null;const batch={id:uid(),deliveredOn:stamp()};if(m.mode==='stock')S.batches.push(batch);
 m.rows.forEach(e=>{const pk=prodKey(e.list,e.name),pp=S.products[pk]||{measure:'units',size:1};pp.name=pp.name||e.name;if(e.measure)pp.measure=e.measure;if(e.size)pp.size=e.size;if(e.min!==undefined)pp.min=e.min;if(e.cost!==undefined)pp.cost=e.cost;
  if(e.bcs){pp.barcodes=pp.barcodes||[];e.bcs.forEach(c=>{if(!pp.barcodes.includes(c))pp.barcodes.push(c)})}
  if(e.list!=='unsorted'||m.mode==='prod'){pp.last=pp.last||Date.now();S.products[pk]=pp}
  if(m.mode==='stock'){const nr={id:uid(),list:e.list,name:e.name,room:e.room,node:e.node,qty:e.qty,open:e.open,rem:e.open?e.rem:1,exp:e.exp,noExp:e.noExp,delivered:e.delivered,vals:{},batches:[batch.id]};if(e.open)nr.openedOn=stamp();if(e.cost!==undefined)nr.cost=e.cost;S.stock.push(nr);logMove('delivery',nr,e.open?e.rem:e.qty,{note:'CSV import'})}});
 if(m.mode==='stock')mergeSealed();save();closeModal();flashMsg('Imported '+m.rows.length+(m.mode==='stock'?' stock lines.':' products.'));render()};

/* ---- snapshot sharing: a readable copy of the stock, as text or a standalone page ---- */
let SN={scope:''};
function snapGroups(){const g=[];S.rooms.filter(r=>!SN.scope||r.id===SN.scope).forEach(R=>{const rs=S.stock.filter(r=>r.room===R.id).sort((a,b)=>pathOf(a).localeCompare(pathOf(b))||a.name.localeCompare(b.name));if(rs.length)g.push([R,rs])});return g}
const snapLine=r=>r.name+' × '+(r.open?'1 open, '+fracLabel(r)+' left':r.qty)+(r.exp&&!r.noExp?' · best before '+fmtDate(r.exp):'');
function snapText(){const t=['Stock snapshot · '+new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})];
 snapGroups().forEach(([R,rs])=>{t.push('','== '+R.name+' ==');let last='';rs.forEach(r=>{const p=r.node?nodePath(r.node).join(' > '):'floor';if(p!==last){t.push(p+':');last=p}t.push('  - '+snapLine(r))})});
 if(t.length===1)t.push('','Nothing in stock.');return t.join('\n')}
function snapHTML(){const d=new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});
 return `<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stock snapshot ${esc(d)}</title><style>body{font:16px system-ui,sans-serif;margin:16px;max-width:760px;color:#1d1d1b}h1{font-size:20px}h2{font-size:17px;margin:20px 0 4px}table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #d6d4cb;padding:5px 6px;text-align:left;vertical-align:top}th{color:#6b6a63;font-weight:600}.mut{color:#6b6a63}</style></head><body><h1>Stock snapshot</h1><p class="mut">${esc(d)}. A read-only copy; it does not update.</p>${snapGroups().map(([R,rs])=>`<h2>${esc(R.name)}</h2><table><tr><th>Item</th><th>Qty</th><th>Best before</th><th>Where</th></tr>${rs.map(r=>`<tr><td>${esc(r.name)}</td><td>${r.open?'open, '+esc(fracLabel(r)):r.qty}</td><td>${r.exp&&!r.noExp?esc(fmtDate(r.exp)):''}</td><td>${esc(r.node?nodePath(r.node).join(' › '):'floor')}</td></tr>`).join('')}</table>`).join('')||'<p>Nothing in stock.</p>'}</body></html>`}
ACT.snap=()=>{SN.scope='';drawSnap()};
function drawSnap(){modal(`<h2>Share a snapshot</h2><p class="mut"><small>A readable copy of what is in stock right now. It contains names, quantities, dates and places only.</small></p>
 <label>Which rooms <select data-c="snsc"><option value="">All rooms</option>${S.rooms.map(r=>`<option value="${r.id}" ${SN.scope===r.id?'selected':''}>${esc(r.name)}</option>`).join('')}</select></label>
 <pre class="snp">${esc(snapText())}</pre>
 <div class="row">${navigator.share?'<button class="pri" data-a="snshare">Share…</button>':''}<button data-a="sncopy">Copy text</button><button data-a="snhtml">Save as web page</button><button data-a="sntxt">Save as .txt</button><button data-a="mclose">Close</button></div>`)}
CH.snsc=el=>{SN.scope=el.value;drawSnap()};
ACT.snshare=async()=>{try{await navigator.share({title:'Stock snapshot',text:snapText()})}catch(e){}};
ACT.sncopy=async()=>{try{await navigator.clipboard.writeText(snapText());flashMsg('Snapshot copied.');closeModal();render()}catch(e){flashMsg('Copy was blocked here. Use Save as .txt instead.')}};
ACT.snhtml=()=>downloadFile('stock-snapshot-'+stamp()+'.html',snapHTML(),'text/html;charset=utf-8');
ACT.sntxt=()=>downloadFile('stock-snapshot-'+stamp()+'.txt',snapText(),'text/plain;charset=utf-8');

/* ---- barcodes: typed, from a keyboard-style scanner, or the camera where the browser can read them ---- */
const CAN_SCAN=typeof BarcodeDetector!=='undefined'&&!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia);
let SCN=null;
async function scanOnce(onCode){if(!CAN_SCAN||SCN)return;
 const ov=document.createElement('div');ov.className='scanov';ov.innerHTML='<video playsinline muted></video><div class="scanbar"><span>Point the camera at the barcode</span><button data-a="scancancel">Cancel</button></div>';(dlg.open?dlg:document.body).appendChild(ov);
 let stream,tm;SCN={stop:()=>{clearInterval(tm);if(stream)stream.getTracks().forEach(t=>t.stop());ov.remove();SCN=null}};
 try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false})}catch(e){SCN.stop();flashMsg('Camera not available: '+(e&&e.name==='NotAllowedError'?'permission was denied.':'no camera was found.'));render();return}
 if(!SCN){stream.getTracks().forEach(t=>t.stop());return}
 const v=ov.querySelector('video');v.srcObject=stream;try{await v.play()}catch(e){}
 let fm=['ean_13','ean_8','upc_a','upc_e','code_128','code_39','itf'];try{const sup=await BarcodeDetector.getSupportedFormats();fm=fm.filter(f=>sup.includes(f))}catch(e){}
 const det=new BarcodeDetector({formats:fm});
 tm=setInterval(async()=>{try{const r=await det.detect(v);if(r.length&&SCN){const c=r[0].rawValue;SCN.stop();onCode(c)}}catch(e){}},250)}
ACT.scancancel=()=>{if(SCN)SCN.stop()};
function applyBarcode(row,i){const c=String(row.bc||'').replace(/\s+/g,'');row.bc=c;row.bcn='';if(!c){renderDeliver();return}
 const p=allProducts().find(x=>x.barcodes.includes(c));
 if(p){if(!row.name.trim()){row.name=p.name;row.list=p.list;row.listSet=false;row.auto=true;row.size=p.size;row.measure=p.measure;if(S.prefs.cost&&p.cost!=null)row.cost=p.cost;row.bcn='Known product: '+p.name}
  else if(!sameName(row.name,p.name))row.bcn='This barcode belongs to “'+p.name+'”.';else row.bcn='Known barcode.'}
 else row.bcn='New barcode. It is remembered with this product when you save.';
 renderDeliver()}
ACT.dscan=b=>{const i=+b.dataset.r;scanOnce(c=>{if(!D||!D.rows[i])return;D.rows[i].bc=c;applyBarcode(D.rows[i],i)})};
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches&&e.target.matches('[data-k=bc]')){e.preventDefault();e.target.blur()}});
